        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
          {[{label:"Budget Balance",val:balBudget},{label:"Actual Balance",val:balActual}].map((item,i)=>(
            <div key={i} style={{ background:item.val<0?"rgba(255,59,48,.15)":"rgba(48,209,88,.1)", border:`1px solid ${item.val<0?"rgba(255,59,48,.3)":"rgba(48,209,88,.2)"}`, borderRadius:14, padding:"12px 14px" }}>
              <div style={{ fontSize:10, color:"rgba(255,255,255,.45)", marginBottom:4 }}>{item.label}</div>
              <div style={{ fontSize:18, fontWeight:700, color:item.val<0?"#FF453A":"#30D158" }}>{totalIncomeBudget>0||totalIncomeActual>0?fmt(item.val):"—"}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding:"0 16px" }}>
        <MonthProgressBanner selYear={selYear} selMonth={selMonth} MONTHS={MONTHS}/>
        {hasPrevMonth&&totalIncomeBudget===0&&totalExpBudget===0&&(
          <CopyLastMonthButton onCopy={onCopyLastMonth} label="Copy full budget from last month"/>
        )}

        {/* Donut */}
        <div style={{ background:cardBg, margin:"12px 0", borderRadius:20, padding:"16px", boxShadow:cardShadow }}>
          <div style={{ fontSize:13, fontWeight:700, color: dark?"#F2F2F7":"#1C1C1E", marginBottom:12 }}>Spending vs Income</div>
          <div style={{ display:"flex", justifyContent:"space-around", alignItems:"center" }}>
            <div style={{ textAlign:"center" }}><DonutChart budget={totalIncomeBudget} actual={totalExpBudget}/><div style={{ fontSize:10, color:"#8E8E93", marginTop:4 }}>Budget Plan</div></div>
            <div style={{ textAlign:"center" }}><DonutChart budget={totalIncomeActual} actual={totalExpActual}/><div style={{ fontSize:10, color:"#8E8E93", marginTop:4 }}>Actual</div></div>
          </div>
        </div>

        {/* Section cards */}
        {[{label:"Income",budget:totalIncomeBudget,actual:totalIncomeActual,icon:"💵",color:"#30D158",tab:"income"},{label:"Expenses",budget:expBudgetTotal,actual:expActualTotal,icon:"💸",color:"#FF6B6B",tab:"expenses"},{label:"Bills",budget:billBudgetTotal,actual:billActualTotal,icon:"📋",color:"#60A5FA",tab:"bills"},{label:"Savings",budget:savBudgetTotal,actual:savActualTotal,icon:"🐷",color:"#FF9500",tab:"savings"}].map((s,i)=>{
          const over=s.budget>0&&s.actual>s.budget; const diff=s.actual-s.budget; const pct=s.budget>0?Math.min(s.actual/s.budget,1):0; const barColor=over?"#FF3B30":pct>0.85?"#FF9500":"#34C759";
          return (
            <button key={i} onClick={()=>setTab(s.tab)} style={{ display:"block", width:"100%", marginBottom:10, background:cardBg, borderRadius:18, padding:"14px 16px", boxShadow:cardShadow, textAlign:"left", fontFamily:"inherit" }}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <div style={{ width:36, height:36, borderRadius:10, background:s.color+"18", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20 }}>{s.icon}</div>
                  <div><div style={{ fontSize:14, fontWeight:700, color: dark?"#F2F2F7":"#1C1C1E" }}>{s.label}</div><div style={{ fontSize:11, color:"#8E8E93" }}>Budget vs Actual</div></div>
                </div>
                <div style={{ textAlign:"right" }}>
                  {over&&<div style={{ fontSize:10, background:"#FFE5E5", color:"#FF3B30", padding:"2px 8px", borderRadius:6, fontWeight:700, marginBottom:3 }}>OVER BUDGET</div>}
                  <div style={{ fontSize:11, color:over?"#FF3B30":diff<0&&s.budget>0?"#34C759":"#8E8E93", fontWeight:600 }}>{s.budget>0&&s.actual>0?(over?`▲ ${fmt(Math.abs(diff))}`:`▼ ${fmt(Math.abs(diff))} left`):"Tap to edit"}</div>
                </div>
              </div>
              <div style={{ display:"flex", gap:16, marginBottom:8 }}>
                <div style={{ flex:1 }}><div style={{ fontSize:10, color:"#8E8E93", marginBottom:2 }}>Budget</div><div style={{ fontSize:15, fontWeight:700, color: dark?"#A0A0A0":"#3C3C43" }}>{s.budget>0?fmt(s.budget):"—"}</div></div>
                <div style={{ flex:1 }}><div style={{ fontSize:10, color:"#8E8E93", marginBottom:2 }}>Actual</div><div style={{ fontSize:15, fontWeight:700, color:over?"#FF3B30": dark?"#F2F2F7":"#1C1C1E" }}>{s.actual>0?fmt(s.actual):"—"}</div></div>
              </div>
              {s.budget>0&&<div style={{ height:5, background: dark?"#2C2C2E":"#F2F2F7", borderRadius:5, overflow:"hidden" }}><div style={{ height:"100%", width:`${pct*100}%`, background:barColor, borderRadius:5, transition:"width .5s" }}/></div>}
            </button>
          );
        })}

        {/* Cash flow summary */}
        <div style={{ background:cardBg, borderRadius:18, padding:"14px 16px", boxShadow:cardShadow, marginBottom:16 }}>
          <div style={{ fontSize:13, fontWeight:700, color: dark?"#F2F2F7":"#1C1C1E", marginBottom:4 }}>Cash Flow Summary</div>
          <div style={{ display:"flex", padding:"6px 0", borderBottom:`1px solid ${dark?"#2C2C2E":"#F2F2F7"}` }}>
            <div style={{ flex:1 }}/><div style={{ width:80, textAlign:"right", fontSize:10, fontWeight:700, color:"#8E8E93", letterSpacing:0.5 }}>BUDGET</div>
            <div style={{ width:80, textAlign:"right", fontSize:10, fontWeight:700, color:"#8E8E93", letterSpacing:0.5 }}>ACTUAL</div>
            <div style={{ width:72, textAlign:"right", fontSize:10, fontWeight:700, color:"#8E8E93", letterSpacing:0.5 }}>DIFF</div>
          </div>
          <Row label="Income" budget={totalIncomeBudget} actual={totalIncomeActual} accent="#30D158"/>
          <Row label="Expenses" budget={expBudgetTotal} actual={expActualTotal} accent="#FF6B6B"/>
          <Row label="Bills" budget={billBudgetTotal} actual={billActualTotal} accent="#60A5FA"/>
          <Row label="Savings" budget={savBudgetTotal} actual={savActualTotal} accent="#FF9500"/>
          <div style={{ display:"flex", padding:"10px 0", marginTop:4 }}>
            <div style={{ width:18, marginRight:10 }}/>
            <div style={{ flex:1, fontSize:13, fontWeight:700, color: dark?"#F2F2F7":"#1C1C1E" }}>Balance</div>
            <div style={{ width:80, textAlign:"right", fontSize:13, fontWeight:700, color:balBudget<0?"#FF3B30":"#34C759" }}>{totalIncomeBudget>0?fmt(balBudget):"—"}</div>
            <div style={{ width:80, textAlign:"right", fontSize:13, fontWeight:700, color:balActual<0?"#FF3B30":"#34C759" }}>{totalIncomeActual>0?fmt(balActual):"—"}</div>
            <div style={{ width:72 }}/>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── IncomeTab ──────────────────────────────────────────────
function IncomeTab({ data, setData, tithingActualAuto, selYear, selMonth, MONTHS, fmt, onBack, prevMonthData }) {
  const { dark, currencySymbol } = React.useContext(ThemeCtx);
  const [draftAmount, setDraftAmount] = useState("");
  const [draftLabel,  setDraftLabel]  = useState("");
  const [draftDate,   setDraftDate]   = useState(todayISO());
  const amountRef = useRef(null);

  const entries = data.incomeEntries || [];
  const totalActual = entries.reduce((s,e)=>s+num(e.amount),0);

  const addEntry = () => {
    const amount = num(draftAmount);
    if (amount<=0) return;
    haptic("success");
    setData(d=>({...d, incomeEntries:[...(d.incomeEntries||[]),{id:genId(),label:draftLabel.trim()||"Income",amount:draftAmount,date:draftDate}]}));
    setDraftAmount(""); setDraftLabel(""); setDraftDate(todayISO());
    setTimeout(()=>amountRef.current&&amountRef.current.focus(),50);
  };
  const removeEntry = (id) => { haptic("medium"); setData(d=>({...d,incomeEntries:(d.incomeEntries||[]).filter(e=>e.id!==id)})); };
  const handleKeyDown = (e) => { if(e.key==="Enter"){e.preventDefault();addEntry();} };

  const copyLastBudget = () => {
    if (!prevMonthData) return;
    setData(d=>({...d, incomeBudget: prevMonthData.incomeBudget||d.incomeBudget}));
  };

  const inputStyle = (active) => ({
    width:"100%", fontSize:active?15:14, fontWeight:active?600:500, color: dark?"#F2F2F7":"#1C1C1E",
    background: dark?"#2C2C2E":"#F7F7F8", borderRadius:10, padding:"10px 12px",
    border:`1px solid ${dark?"#3A3A3C":"#EFEFEF"}`, fontFamily:"inherit",
  });

  return (
    <div style={{ animation:"fadeUp .3s ease" }}>
      <SectionHeader title="Income" icon="💵" color="#30D158" month={`${MONTHS[selMonth]} ${selYear}`} onBack={onBack}/>
      <div style={{ padding:"0 16px" }}>
        <MonthProgressBanner selYear={selYear} selMonth={selMonth} MONTHS={MONTHS}/>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, margin:"12px 0" }}>
          <div style={{ background: dark?"#1C1C1E":"#fff", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)" }}>
            <div style={{ fontSize:10, color:"#8E8E93", marginBottom:4 }}>Total Income</div>
            <div style={{ fontSize:20, fontWeight:700, color:"#30D158" }}>{totalActual>0?fmt(totalActual):"—"}</div>
            <div style={{ fontSize:10, color:"#8E8E93", marginTop:2 }}>{entries.length} paycheck{entries.length!==1?"s":""} logged</div>
          </div>
          <div style={{ background:"#FFF9F0", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)", border:"1px solid #FFE4B0" }}>
            <div style={{ fontSize:10, color:"#8E8E93", marginBottom:4 }}>🙏 Tithing (10%)</div>
            <div style={{ fontSize:20, fontWeight:700, color:"#FF9500" }}>{totalActual>0?fmt(tithingActualAuto):"—"}</div>
            <div style={{ fontSize:10, color:"#FF9500", marginTop:2 }}>auto-calculated</div>
          </div>
        </div>

        <Card>
          <div style={{ fontSize:12, fontWeight:700, color:"#8E8E93", letterSpacing:0.5, marginBottom:10 }}>EXPECTED MONTHLY INCOME</div>
          {prevMonthData?.incomeBudget && <CopyLastMonthButton onCopy={copyLastBudget} label="Copy Last Month's Expected Income"/>}
          <div style={{ display:"flex", alignItems:"center", gap:4, padding:"10px 12px", background: dark?"#2C2C2E":"#F7F7F8", borderRadius:10, border:`1px solid ${dark?"#3A3A3C":"#EFEFEF"}` }}>
            <span style={{ fontSize:13, color:"#C7C7CC" }}>{currencySymbol}</span>
            <input type="number" inputMode="decimal" placeholder="0.00" value={data.incomeBudget||""} onChange={e=>setData(d=>({...d,incomeBudget:e.target.value}))}
              style={{ flex:1, fontSize:15, fontWeight:600, color: dark?"#F2F2F7":"#3C3C43", background:"transparent", border:"none", outline:"none", fontFamily:"inherit" }}/>
          </div>
          <div style={{ fontSize:11, color:"#8E8E93", marginTop:6 }}>What you expect to earn this month</div>
        </Card>

        <Card>
          <div style={{ fontSize:12, fontWeight:700, color:"#8E8E93", letterSpacing:0.5, marginBottom:12 }}>LOG A PAYCHECK</div>
          <div style={{ marginBottom:8 }}>
            <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>SOURCE / LABEL</div>
            <input type="text" placeholder="e.g. Salary, Side Job, Freelance…" value={draftLabel} onChange={e=>setDraftLabel(e.target.value)} onKeyDown={handleKeyDown} style={inputStyle(false)}/>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12 }}>
            <div>
              <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>AMOUNT</div>
              <div style={{ display:"flex", alignItems:"center", gap:4, padding:"10px 12px", background: dark?"#2C2C2E":"#F7F7F8", borderRadius:10, border:`1px solid ${dark?"#3A3A3C":"#EFEFEF"}` }}>
                <span style={{ fontSize:13, color:"#C7C7CC" }}>{currencySymbol}</span>
                <input ref={amountRef} type="number" inputMode="decimal" placeholder="0.00" value={draftAmount} onChange={e=>setDraftAmount(e.target.value)} onKeyDown={handleKeyDown}
                  style={{ flex:1, fontSize:15, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", background:"transparent", border:"none", outline:"none", fontFamily:"inherit", minWidth:0 }}/>
              </div>
            </div>
            <div>
              <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>DATE</div>
              <input type="date" value={draftDate} onChange={e=>setDraftDate(e.target.value)}
                style={{ width:"100%", fontSize:13, fontWeight:500, color: dark?"#F2F2F7":"#1C1C1E", background: dark?"#2C2C2E":"#F7F7F8", borderRadius:10, padding:"10px 10px", border:`1px solid ${dark?"#3A3A3C":"#EFEFEF"}`, fontFamily:"inherit" }}/>
            </div>
          </div>
          <button onClick={addEntry} disabled={!num(draftAmount)} style={{ width:"100%", padding:"13px", background:num(draftAmount)>0?"#30D158":"#E5E5EA", color:num(draftAmount)>0?"#fff":"#C7C7CC", borderRadius:12, fontSize:15, fontWeight:700, border:"none", cursor:num(draftAmount)>0?"pointer":"default", transition:"background .2s" }}>↵ Save Paycheck</button>
          <div style={{ fontSize:11, color:"#8E8E93", textAlign:"center", marginTop:6 }}>Press Enter or tap Save — input clears for next entry</div>
        </Card>

        {entries.length>0&&(
          <Card>
            <div style={{ fontSize:12, fontWeight:700, color:"#8E8E93", letterSpacing:0.5, marginBottom:12 }}>PAYCHECKS THIS MONTH</div>
            {[...entries].reverse().map((entry,i)=>(
              <div key={entry.id} style={{ display:"flex", alignItems:"center", padding:"10px 0", borderBottom:i<entries.length-1?`1px solid ${dark?"#2C2C2E":"#F2F2F7"}`:"none" }}>
                <div style={{ width:40, height:40, borderRadius:10, background:"#F0FFF4", flexShrink:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", marginRight:12 }}>
                  <div style={{ fontSize:8, color:"#34C759", fontWeight:700, letterSpacing:0.3 }}>{new Date(entry.date+"T12:00:00").toLocaleDateString("en-US",{month:"short"}).toUpperCase()}</div>
                  <div style={{ fontSize:16, fontWeight:800, color:"#34C759", lineHeight:1 }}>{new Date(entry.date+"T12:00:00").getDate()}</div>
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{entry.label}</div>
                  <div style={{ fontSize:11, color:"#8E8E93" }}>{fmtDate(entry.date+"T12:00:00")}</div>
                </div>
                <div style={{ textAlign:"right", marginRight:10 }}>
                  <div style={{ fontSize:16, fontWeight:700, color:"#30D158" }}>{fmt(num(entry.amount))}</div>
                  <div style={{ fontSize:10, color:"#8E8E93" }}>10% → {fmt(num(entry.amount)*0.1)}</div>
                </div>
                <button onClick={()=>removeEntry(entry.id)} style={{ background:"#FFE5E5", border:"none", borderRadius:8, width:30, height:30, fontSize:14, color:"#FF3B30", cursor:"pointer", flexShrink:0 }}>✕</button>
              </div>
            ))}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:12, paddingTop:10, borderTop:`2px solid ${dark?"#2C2C2E":"#F2F2F7"}` }}>
              <div style={{ fontSize:13, fontWeight:700, color: dark?"#F2F2F7":"#1C1C1E" }}>Total</div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:18, fontWeight:800, color:"#30D158" }}>{fmt(totalActual)}</div>
                <div style={{ fontSize:11, color:"#FF9500" }}>Tithing: {fmt(tithingActualAuto)}</div>
              </div>
            </div>
          </Card>
        )}
        {entries.length===0&&<InfoBox text="Enter each paycheck or income payment and press Enter or Save. They'll stack up below with their dates. The total auto-updates everywhere in the app."/>}
      </div>
    </div>
  );
}

// ── SectionTab ─────────────────────────────────────────────
function SectionTab({ title, icon, color, cats, customCats, budget, actual, notes, expEntries, setBudget, setActual, setNotes, setExpEntries, onAddCustomCat, onDeleteCustomCat, showRecurring, recurringIds, onToggleRecurring, tithingBudgetAuto, tithingActualAuto, selYear, selMonth, MONTHS, fmt, onBack, prevMonthData, section }) {
  const { dark, currencySymbol } = React.useContext(ThemeCtx);
  const [openLogCat, setOpenLogCat] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [draftAmt, setDraftAmt] = useState("");
  const [draftDesc, setDraftDesc] = useState("");
  const [draftDate, setDraftDate] = useState(todayISO());

  const addExpEntry = (catId) => {
    const amount = num(draftAmt);
    if (amount <= 0) return;
    haptic("success");
    const entry = { id: genId(), amount: draftAmt, desc: draftDesc.trim() || cat_label(catId), date: draftDate };
    const updated = [...(expEntries[catId] || []), entry];
    setExpEntries({ [catId]: updated });
    // Auto-sum actual from entries
    const total = updated.reduce((s,e) => s + num(e.amount), 0);
    setActual({ [catId]: String(total) });
    setDraftAmt(""); setDraftDesc(""); setDraftDate(todayISO());
  };

  // Auto-fill actual for recurring bills with a budget amount set
  React.useEffect(() => {
    if (!showRecurring || !recurringIds || !recurringIds.length) return;
    recurringIds.forEach(id => {
      const b = budget[id];
      const a = actual[id];
      if (b && num(b) > 0 && (!a || num(a) === 0)) {
        setActual({ [id]: b });
      }
    });
  }, [JSON.stringify(recurringIds), JSON.stringify(budget)]);
  const removeExpEntry = (catId, entryId) => {
    haptic("medium");
    const updated = (expEntries[catId] || []).filter(e => e.id !== entryId);
    setExpEntries({ [catId]: updated });
    const total = updated.reduce((s,e) => s + num(e.amount), 0);
    setActual({ [catId]: updated.length > 0 ? String(total) : "" });
  };
  const allCatsForLabel = [...cats, ...(customCats||[])];
  const cat_label = (catId) => (allCatsForLabel.find(c=>c.id===catId)||{}).label || "Expense";
  const allCats = [...cats, ...(customCats||[])];
  const budgetTotal = allCats.reduce((s,c)=>s+num(budget[c.id]||0),0)+(tithingBudgetAuto||0);
  const actualTotal = allCats.reduce((s,c)=>s+num(actual[c.id]||0),0)+(tithingActualAuto||0);
  const overTotal = budgetTotal>0&&actualTotal>budgetTotal;

  const copyLastBudget = () => {
    if (!prevMonthData) return;
    const srcBudget = section === "bills" ? prevMonthData.billBudget : section === "expenses" ? prevMonthData.expBudget : {};
    if (!srcBudget) return;
    const patch = {};
    allCats.forEach(c => { if (srcBudget[c.id]) patch[c.id] = srcBudget[c.id]; });
    setBudget(patch);
  };

  const hasPrevBudget = () => {
    if (!prevMonthData) return false;
    const srcBudget = section === "bills" ? prevMonthData.billBudget : section === "expenses" ? prevMonthData.expBudget : {};
    return srcBudget && Object.values(srcBudget).some(v => num(v) > 0);
  };

  return (
    <div style={{ animation:"fadeUp .3s ease" }}>
      <SectionHeader title={title} icon={icon} color={color} month={`${MONTHS[selMonth]} ${selYear}`} onBack={onBack}/>
      <div style={{ padding:"0 16px" }}>
        <MonthProgressBanner selYear={selYear} selMonth={selMonth} MONTHS={MONTHS}/>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, margin:"12px 0" }}>
          <div style={{ background: dark?"#1C1C1E":"#fff", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)" }}>
            <div style={{ fontSize:10, color:"#8E8E93", marginBottom:4 }}>Total Budget</div>
            <div style={{ fontSize:18, fontWeight:700, color: dark?"#A0A0A0":"#3C3C43" }}>{budgetTotal>0?fmt(budgetTotal):"—"}</div>
          </div>
          <div style={{ background: dark?"#1C1C1E":"#fff", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)", border:`1px solid ${overTotal?"#FFCDD2":"transparent"}` }}>
            <div style={{ fontSize:10, color:"#8E8E93", marginBottom:4 }}>Total Actual</div>
            <div style={{ fontSize:18, fontWeight:700, color:overTotal?"#FF3B30": dark?"#F2F2F7":"#1C1C1E" }}>{actualTotal>0?fmt(actualTotal):"—"}</div>
          </div>
        </div>

        <Card>
          {hasPrevBudget() && <CopyLastMonthButton onCopy={copyLastBudget}/>}
          {tithingBudgetAuto!=null&&(
            <div style={{ paddingBottom:14, marginBottom:12, borderBottom:`1px solid ${dark?"#2C2C2E":"#F2F2F7"}` }}>
              <div style={{ display:"flex", alignItems:"center", marginBottom:8 }}>
                <div style={{ fontSize:20, marginRight:10 }}>🙏</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:14, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E" }}>Tithing (10%)</div>
                  <div style={{ fontSize:10, color:"#FF9500", fontWeight:600 }}>Auto-calculated from actual income</div>
                </div>
                <div style={{ fontSize:9, background:"#FFF3E0", color:"#FF9500", padding:"3px 8px", borderRadius:6, fontWeight:700 }}>AUTO</div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                <div style={{ minWidth:0 }}>
                  <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>BUDGET</div>
                  <div style={{ padding:"10px 12px", background:"#FFF9F0", borderRadius:10, border:"1px solid #FFE4B0", fontSize:15, fontWeight:700, color:"#FF9500" }}>{tithingBudgetAuto>0?fmt(tithingBudgetAuto):"—"}</div>
                </div>
                <div style={{ minWidth:0 }}>
                  <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>ACTUAL</div>
                  <div style={{ padding:"10px 12px", background:"#FFF9F0", borderRadius:10, border:"1px solid #FFE4B0", fontSize:15, fontWeight:700, color:"#FF9500" }}>{tithingActualAuto>0?fmt(tithingActualAuto):"—"}</div>
                </div>
              </div>
            </div>
          )}

          {allCats.map((cat,ci)=>{
            const isCustom = !(cats.find(c=>c.id===cat.id));
            const b=num(budget[cat.id]||0), a=num(actual[cat.id]||0), over=b>0&&a>b, pct=b>0?Math.min(a/b,1):0;
            const barColor=over?"#FF3B30":pct>0.85?"#FF9500":"#34C759";
            const isRecurring=showRecurring&&recurringIds&&recurringIds.includes(cat.id);
            return (
              <div key={cat.id} style={{ paddingBottom:14, marginBottom:12, borderBottom:ci<allCats.length-1?`1px solid ${dark?"#2C2C2E":"#F2F2F7"}`:"none" }}>
                <div style={{ display:"flex", alignItems:"center", marginBottom:8 }}>
                  <div style={{ fontSize:20, marginRight:10 }}>{cat.icon}</div>
                  <div style={{ flex:1, fontSize:14, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E" }}>{cat.label}</div>
                  {over&&<div style={{ fontSize:9, background:"#FFE5E5", color:"#FF3B30", padding:"3px 8px", borderRadius:6, fontWeight:700, marginRight:6 }}>OVER</div>}
                  {showRecurring&&<RecurringToggle catId={cat.id} recurringIds={recurringIds||[]} onToggle={onToggleRecurring}/>}
                  {isCustom&&onDeleteCustomCat&&(confirmDeleteId===cat.id?(
                    <div style={{ display:"flex", alignItems:"center", gap:4, marginLeft:6 }}>
                      <span style={{ fontSize:11, color:"#FF3B30", fontWeight:600 }}>Delete?</span>
                      <button onClick={()=>{ haptic("heavy"); onDeleteCustomCat(cat.id); setConfirmDeleteId(null); }} style={{ background:"#FF3B30", border:"none", borderRadius:6, width:24, height:24, fontSize:12, color:"#fff", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>✓</button>
                      <button onClick={()=>setConfirmDeleteId(null)} style={{ background: dark?"#3A3A3C":"#E5E5EA", border:"none", borderRadius:6, width:24, height:24, fontSize:12, color: dark?"#E0E0E0":"#3C3C43", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
                    </div>
                  ):(
                    <button onClick={()=>setConfirmDeleteId(cat.id)} style={{ marginLeft:6, background:"#FFE5E5", border:"none", borderRadius:7, width:26, height:26, fontSize:13, color:"#FF3B30", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }} title="Delete category">🗑</button>
                  ))}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                  <div style={{ minWidth:0 }}>
                    <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>BUDGET {isRecurring&&<span style={{color:"#007AFF"}}>🔁</span>}</div>
                    <NumInput val={budget[cat.id]} placeholder="0.00" onChange={v=>setBudget({[cat.id]:v})} color={dark?"#A0A0A0":"#3C3C43"}/>
                  </div>
                  <div style={{ minWidth:0 }}>
                    <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>ACTUAL {isRecurring&&num(budget[cat.id])>0&&<span style={{color:"#007AFF",background:"#E8F5FF",padding:"1px 5px",borderRadius:4,fontSize:9}}>AUTO</span>}</div>
                    <NumInput val={actual[cat.id]} placeholder="0.00" onChange={v=>setActual({[cat.id]:v})} color={over?"#FF3B30": dark?"#F2F2F7":"#1C1C1E"} highlight={over}/>
                  </div>
                </div>
                {b>0&&a>0&&(<div style={{ marginTop:8, height:4, background: dark?"#2C2C2E":"#F2F2F7", borderRadius:4, overflow:"hidden" }}><div style={{ height:"100%", width:`${pct*100}%`, background:barColor, borderRadius:4, transition:"width .4s" }}/></div>)}
                {over&&<div style={{ fontSize:11, color:"#FF3B30", marginTop:5, fontWeight:600 }}>Over by {fmt(a-b)}</div>}
                {b>0&&a>0&&!over&&<div style={{ fontSize:11, color:"#34C759", marginTop:5, fontWeight:600 }}>{fmt(b-a)} remaining</div>}

                {/* Transaction log (expenses + bills) */}
                {(section==="expenses"||section==="bills")&&(()=>{
                  const logColor = section==="bills" ? "#60A5FA" : "#FF6B6B";
                  const logBg    = section==="bills" ? (dark?"#1A1A2A":"#F0F6FF") : (dark?"#1A1A1E":"#FFF9F9");
                  const logBorder= section==="bills" ? (dark?"#2A3A5A":"#BFDBFE") : (dark?"#3A2A2A":"#FFE5E5");
                  const dateBg   = section==="bills" ? (dark?"#1A2A3A":"#DBEAFE") : (dark?"#2A1A1A":"#FFE5E5");
                  const entries  = expEntries ? (expEntries[cat.id] || []) : [];
                  const isOpen   = openLogCat === cat.id;
                  return (
                    <div style={{ marginTop:10 }}>
                      <button onClick={()=>{ setOpenLogCat(isOpen?null:cat.id); setDraftAmt(""); setDraftDesc(""); setDraftDate(todayISO()); }}
                        style={{ fontSize:11, fontWeight:700, color:logColor, background:logBg, border:`1px solid ${logBorder}`, borderRadius:8, padding:"5px 10px", cursor:"pointer", display:"flex", alignItems:"center", gap:5 }}>
                        {isOpen?"▲ Hide log":`🧾 ${entries.length>0?`${entries.length} transaction${entries.length!==1?"s":""} · ${fmt(entries.reduce((s,e)=>s+num(e.amount),0))}`:"Log transactions"}`}
                      </button>
                      {isOpen&&(
                        <div style={{ marginTop:8, background:logBg, borderRadius:12, padding:"12px", border:`1px solid ${logBorder}` }}>
                          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:6 }}>
                            <div>
                              <div style={{ fontSize:9, color:"#8E8E93", fontWeight:700, letterSpacing:0.4, marginBottom:3 }}>DESCRIPTION</div>
                              <input type="text" placeholder="What for?" value={draftDesc} onChange={e=>setDraftDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addExpEntry(cat.id)}
                                style={{ width:"100%", fontSize:13, fontWeight:500, color: dark?"#F2F2F7":"#1C1C1E", background: dark?"#2C2C2E":"#fff", borderRadius:8, padding:"8px 10px", border:`1px solid ${dark?"#3A3A3C":"#E5E5EA"}`, fontFamily:"inherit" }}/>
                            </div>
                            <div>
                              <div style={{ fontSize:9, color:"#8E8E93", fontWeight:700, letterSpacing:0.4, marginBottom:3 }}>DATE</div>
                              <input type="date" value={draftDate} onChange={e=>setDraftDate(e.target.value)}
                                style={{ width:"100%", fontSize:12, fontWeight:500, color: dark?"#F2F2F7":"#1C1C1E", background: dark?"#2C2C2E":"#fff", borderRadius:8, padding:"8px 8px", border:`1px solid ${dark?"#3A3A3C":"#E5E5EA"}`, fontFamily:"inherit" }}/>
                            </div>
                          </div>
                          <div style={{ display:"flex", gap:6, marginBottom:10 }}>
                            <div style={{ flex:1, display:"flex", alignItems:"center", gap:4, padding:"8px 10px", background: dark?"#2C2C2E":"#fff", borderRadius:8, border:`1px solid ${dark?"#3A3A3C":"#E5E5EA"}` }}>
                              <span style={{ fontSize:12, color:"#C7C7CC", flexShrink:0 }}>{currencySymbol}</span>
                              <input type="number" inputMode="decimal" placeholder="0.00" value={draftAmt} onChange={e=>setDraftAmt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addExpEntry(cat.id)}
                                style={{ flex:1, fontSize:14, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", background:"transparent", border:"none", outline:"none", fontFamily:"inherit", minWidth:0 }}/>
                            </div>
                            <button onClick={()=>addExpEntry(cat.id)} disabled={!num(draftAmt)} style={{ padding:"8px 14px", background:num(draftAmt)>0?logColor:"#E5E5EA", color:num(draftAmt)>0?"#fff":"#C7C7CC", borderRadius:8, fontSize:13, fontWeight:700, border:"none", cursor:num(draftAmt)>0?"pointer":"default" }}>+ Add</button>
                          </div>
                          {entries.length>0?(
                            <div>
                              {[...entries].reverse().map((entry,ei)=>(
                                <div key={entry.id} style={{ display:"flex", alignItems:"center", padding:"7px 0", borderBottom:ei<entries.length-1?`1px solid ${logBorder}`:"none" }}>
                                  <div style={{ width:34, height:34, borderRadius:8, background:dateBg, flexShrink:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", marginRight:10 }}>
                                    <div style={{ fontSize:7, color:logColor, fontWeight:700, letterSpacing:0.3 }}>{new Date(entry.date+"T12:00:00").toLocaleDateString("en-US",{month:"short"}).toUpperCase()}</div>
                                    <div style={{ fontSize:14, fontWeight:800, color:logColor, lineHeight:1 }}>{new Date(entry.date+"T12:00:00").getDate()}</div>
                                  </div>
                                  <div style={{ flex:1, minWidth:0 }}>
                                    <div style={{ fontSize:13, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{entry.desc}</div>
                                    <div style={{ fontSize:10, color:"#8E8E93" }}>{fmtDate(entry.date+"T12:00:00")}</div>
                                  </div>
                                  <div style={{ fontSize:15, fontWeight:700, color:logColor, marginRight:8 }}>{fmt(num(entry.amount))}</div>
                                  <button onClick={()=>removeExpEntry(cat.id, entry.id)} style={{ background: dark?"#2A1A1A":"#FFE5E5", border:"none", borderRadius:7, width:26, height:26, fontSize:12, color:"#FF3B30", cursor:"pointer", flexShrink:0 }}>✕</button>
                                </div>
                              ))}
                              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8, paddingTop:6, borderTop:`1.5px solid ${logBorder}` }}>
                                <div style={{ fontSize:11, fontWeight:700, color:"#8E8E93" }}>{entries.length} transaction{entries.length!==1?"s":""}</div>
                                <div style={{ fontSize:15, fontWeight:800, color:logColor }}>{fmt(entries.reduce((s,e)=>s+num(e.amount),0))}</div>
                              </div>
                            </div>
                          ):(
                            <div style={{ fontSize:12, color:"#8E8E93", textAlign:"center", padding:"8px 0" }}>No transactions yet — add one above</div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
            );
          })}
          <AddCategoryRow onAdd={onAddCustomCat}/>
        </Card>
      </div>
    </div>
  );
}

// ── SavingsTab ─────────────────────────────────────────────
function SavingsTab({ data, setData, customSavCats, onAddCustomSavCat, onDeleteCustomSavCat, selYear, selMonth, MONTHS, fmt, onBack, prevMonthData }) {
  const { dark, currencySymbol } = React.useContext(ThemeCtx);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [openLogCat, setOpenLogCat] = useState(null);
  const [draftAmt, setDraftAmt] = useState("");
  const [draftDesc, setDraftDesc] = useState("");
  const [draftDate, setDraftDate] = useState(todayISO());
  const allCats = [...DEFAULT_SAVINGS_CATS, ...(customSavCats||[])];

  const addSavEntry = (catId) => {
    const amount = num(draftAmt);
    if (amount <= 0) return;
    haptic("success");
    const entry = { id: genId(), amount: draftAmt, desc: draftDesc.trim() || "Deposit", date: draftDate };
    const updated = [...((data.savEntries||{})[catId] || []), entry];
    setData(d => ({ ...d, savEntries: { ...(d.savEntries||{}), [catId]: updated }, savActual: { ...d.savActual, [catId]: String(updated.reduce((s,e)=>s+num(e.amount),0)) } }));
    setDraftAmt(""); setDraftDesc(""); setDraftDate(todayISO());
  };
  const removeSavEntry = (catId, entryId) => {
    haptic("medium");
    const updated = ((data.savEntries||{})[catId] || []).filter(e => e.id !== entryId);
    setData(d => ({ ...d, savEntries: { ...(d.savEntries||{}), [catId]: updated }, savActual: { ...d.savActual, [catId]: updated.length > 0 ? String(updated.reduce((s,e)=>s+num(e.amount),0)) : "" } }));
  };
  const budgetTotal = allCats.reduce((s,c)=>s+num(data.savBudget[c.id]||0),0);
  const actualTotal = allCats.reduce((s,c)=>s+num(data.savActual[c.id]||0),0);

  const copyLastBudget = () => {
    if (!prevMonthData?.savBudget) return;
    setData(d => ({ ...d, savBudget: { ...d.savBudget, ...prevMonthData.savBudget } }));
  };
  const hasPrevBudget = prevMonthData?.savBudget && Object.values(prevMonthData.savBudget).some(v=>num(v)>0);

  return (
    <div style={{ animation:"fadeUp .3s ease" }}>
      <SectionHeader title="Savings" icon="🐷" color="#FF9500" month={`${MONTHS[selMonth]} ${selYear}`} onBack={onBack}/>
      <div style={{ padding:"0 16px" }}>
        <MonthProgressBanner selYear={selYear} selMonth={selMonth} MONTHS={MONTHS}/>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, margin:"12px 0" }}>
          <div style={{ background: dark?"#1C1C1E":"#fff", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)" }}>
            <div style={{ fontSize:10, color:"#8E8E93", marginBottom:4 }}>Total Budget</div>
            <div style={{ fontSize:18, fontWeight:700, color: dark?"#A0A0A0":"#3C3C43" }}>{budgetTotal>0?fmt(budgetTotal):"—"}</div>
          </div>
          <div style={{ background: dark?"#1C1C1E":"#fff", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)" }}>
            <div style={{ fontSize:10, color:"#8E8E93", marginBottom:4 }}>Total Actual</div>
            <div style={{ fontSize:18, fontWeight:700, color: dark?"#F2F2F7":"#1C1C1E" }}>{actualTotal>0?fmt(actualTotal):"—"}</div>
          </div>
        </div>
        <Card>
          {hasPrevBudget && <CopyLastMonthButton onCopy={copyLastBudget}/>}
          {allCats.map((cat,ci)=>{
            const isCustom = !(DEFAULT_SAVINGS_CATS.find(c=>c.id===cat.id));
            const b=num(data.savBudget[cat.id]||0), a=num(data.savActual[cat.id]||0), pct=b>0?Math.min(a/b,1):0;
            return (
              <div key={cat.id} style={{ paddingBottom:14, marginBottom:12, borderBottom:ci<allCats.length-1?`1px solid ${dark?"#2C2C2E":"#F2F2F7"}`:"none" }}>
                <div style={{ display:"flex", alignItems:"center", marginBottom:8 }}>
                  <div style={{ fontSize:20, marginRight:10 }}>{cat.icon}</div>
                  <div style={{ flex:1, fontSize:14, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E" }}>{cat.label}</div>
                  {isCustom&&onDeleteCustomSavCat&&(confirmDeleteId===cat.id?(
                    <div style={{ display:"flex", alignItems:"center", gap:4, marginLeft:6 }}>
                      <span style={{ fontSize:11, color:"#FF3B30", fontWeight:600 }}>Delete?</span>
                      <button onClick={()=>{ haptic("heavy"); onDeleteCustomSavCat(cat.id); setConfirmDeleteId(null); }} style={{ background:"#FF3B30", border:"none", borderRadius:6, width:24, height:24, fontSize:12, color:"#fff", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>✓</button>
                      <button onClick={()=>setConfirmDeleteId(null)} style={{ background: dark?"#3A3A3C":"#E5E5EA", border:"none", borderRadius:6, width:24, height:24, fontSize:12, color: dark?"#E0E0E0":"#3C3C43", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
                    </div>
                  ):(
                    <button onClick={()=>setConfirmDeleteId(cat.id)} style={{ marginLeft:6, background:"#FFE5E5", border:"none", borderRadius:7, width:26, height:26, fontSize:13, color:"#FF3B30", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }} title="Delete category">🗑</button>
                  ))}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                  <div style={{ minWidth:0 }}>
                    <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>BUDGET</div>
                    <NumInput val={data.savBudget[cat.id]} placeholder="0.00" onChange={v=>setData(d=>({...d,savBudget:{...d.savBudget,[cat.id]:v}}))} color={dark?"#A0A0A0":"#3C3C43"}/>
                  </div>
                  <div style={{ minWidth:0 }}>
                    <div style={{ fontSize:10, color:"#8E8E93", fontWeight:600, marginBottom:4, letterSpacing:0.4 }}>ACTUAL</div>
                    <NumInput val={data.savActual[cat.id]} placeholder="0.00" onChange={v=>setData(d=>({...d,savActual:{...d.savActual,[cat.id]:v}}))} color={dark?"#F2F2F7":"#1C1C1E"}/>
                  </div>
                </div>
                {b>0&&a>0&&<div style={{ marginTop:8, height:4, background: dark?"#2C2C2E":"#F2F2F7", borderRadius:4, overflow:"hidden" }}><div style={{ height:"100%", width:`${pct*100}%`, background:"#FF9500", borderRadius:4, transition:"width .4s" }}/></div>}
                {b>0&&a>0&&<div style={{ fontSize:11, color:"#FF9500", marginTop:5, fontWeight:600 }}>{fmt(a)} saved of {fmt(b)} goal</div>}

                {/* Savings deposit log */}
                {(()=>{
                  const entries = (data.savEntries||{})[cat.id] || [];
                  const isOpen  = openLogCat === cat.id;
                  return (
                    <div style={{ marginTop:10 }}>
                      <button onClick={()=>{ setOpenLogCat(isOpen?null:cat.id); setDraftAmt(""); setDraftDesc(""); setDraftDate(todayISO()); }}
                        style={{ fontSize:11, fontWeight:700, color:"#FF9500", background: dark?"#2A1A00":"#FFF8EC", border:`1px solid ${dark?"#4A3A00":"#FFE4B0"}`, borderRadius:8, padding:"5px 10px", cursor:"pointer", display:"flex", alignItems:"center", gap:5 }}>
                        {isOpen?"▲ Hide log":`💰 ${entries.length>0?`${entries.length} deposit${entries.length!==1?"s":""} · ${fmt(entries.reduce((s,e)=>s+num(e.amount),0))}`:"Log deposits"}`}
                      </button>
                      {isOpen&&(
                        <div style={{ marginTop:8, background: dark?"#1A1500":"#FFFBF0", borderRadius:12, padding:"12px", border:`1px solid ${dark?"#4A3A00":"#FFE4B0"}` }}>
                          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:6 }}>
                            <div>
                              <div style={{ fontSize:9, color:"#8E8E93", fontWeight:700, letterSpacing:0.4, marginBottom:3 }}>NOTE</div>
                              <input type="text" placeholder="e.g. Paycheck transfer" value={draftDesc} onChange={e=>setDraftDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSavEntry(cat.id)}
                                style={{ width:"100%", fontSize:13, fontWeight:500, color: dark?"#F2F2F7":"#1C1C1E", background: dark?"#2C2C2E":"#fff", borderRadius:8, padding:"8px 10px", border:`1px solid ${dark?"#3A3A3C":"#E5E5EA"}`, fontFamily:"inherit" }}/>
                            </div>
                            <div>
                              <div style={{ fontSize:9, color:"#8E8E93", fontWeight:700, letterSpacing:0.4, marginBottom:3 }}>DATE</div>
                              <input type="date" value={draftDate} onChange={e=>setDraftDate(e.target.value)}
                                style={{ width:"100%", fontSize:12, fontWeight:500, color: dark?"#F2F2F7":"#1C1C1E", background: dark?"#2C2C2E":"#fff", borderRadius:8, padding:"8px 8px", border:`1px solid ${dark?"#3A3A3C":"#E5E5EA"}`, fontFamily:"inherit" }}/>
                            </div>
                          </div>
                          <div style={{ display:"flex", gap:6, marginBottom:10 }}>
                            <div style={{ flex:1, display:"flex", alignItems:"center", gap:4, padding:"8px 10px", background: dark?"#2C2C2E":"#fff", borderRadius:8, border:`1px solid ${dark?"#3A3A3C":"#E5E5EA"}` }}>
                              <span style={{ fontSize:12, color:"#C7C7CC", flexShrink:0 }}>{currencySymbol}</span>
                              <input type="number" inputMode="decimal" placeholder="0.00" value={draftAmt} onChange={e=>setDraftAmt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSavEntry(cat.id)}
                                style={{ flex:1, fontSize:14, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", background:"transparent", border:"none", outline:"none", fontFamily:"inherit", minWidth:0 }}/>
                            </div>
                            <button onClick={()=>addSavEntry(cat.id)} disabled={!num(draftAmt)} style={{ padding:"8px 14px", background:num(draftAmt)>0?"#FF9500":"#E5E5EA", color:num(draftAmt)>0?"#fff":"#C7C7CC", borderRadius:8, fontSize:13, fontWeight:700, border:"none", cursor:num(draftAmt)>0?"pointer":"default" }}>+ Add</button>
                          </div>
                          {entries.length>0?(
                            <div>
                              {[...entries].reverse().map((entry,ei)=>(
                                <div key={entry.id} style={{ display:"flex", alignItems:"center", padding:"7px 0", borderBottom:ei<entries.length-1?`1px solid ${dark?"#3A2A00":"#FFE4B0"}`:"none" }}>
                                  <div style={{ width:34, height:34, borderRadius:8, background: dark?"#2A1A00":"#FFF0CC", flexShrink:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", marginRight:10 }}>
                                    <div style={{ fontSize:7, color:"#FF9500", fontWeight:700, letterSpacing:0.3 }}>{new Date(entry.date+"T12:00:00").toLocaleDateString("en-US",{month:"short"}).toUpperCase()}</div>
                                    <div style={{ fontSize:14, fontWeight:800, color:"#FF9500", lineHeight:1 }}>{new Date(entry.date+"T12:00:00").getDate()}</div>
                                  </div>
                                  <div style={{ flex:1, minWidth:0 }}>
                                    <div style={{ fontSize:13, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{entry.desc}</div>
                                    <div style={{ fontSize:10, color:"#8E8E93" }}>{fmtDate(entry.date+"T12:00:00")}</div>
                                  </div>
                                  <div style={{ fontSize:15, fontWeight:700, color:"#FF9500", marginRight:8 }}>{fmt(num(entry.amount))}</div>
                                  <button onClick={()=>removeSavEntry(cat.id, entry.id)} style={{ background: dark?"#2A1A00":"#FFE5E5", border:"none", borderRadius:7, width:26, height:26, fontSize:12, color:"#FF3B30", cursor:"pointer", flexShrink:0 }}>✕</button>
                                </div>
                              ))}
                              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8, paddingTop:6, borderTop:`1.5px solid ${dark?"#4A3A00":"#FFE4B0"}` }}>
                                <div style={{ fontSize:11, fontWeight:700, color:"#8E8E93" }}>{entries.length} deposit{entries.length!==1?"s":""}</div>
                                <div style={{ fontSize:15, fontWeight:800, color:"#FF9500" }}>{fmt(entries.reduce((s,e)=>s+num(e.amount),0))}</div>
                              </div>
                            </div>
                          ):(
                            <div style={{ fontSize:12, color:"#8E8E93", textAlign:"center", padding:"8px 0" }}>No deposits logged yet</div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })()}
              </div>
            );
          })}
          <AddCategoryRow onAdd={onAddCustomSavCat}/>
        </Card>
      </div>
    </div>
  );
}

// ── MonthlyTab ─────────────────────────────────────────────
// FIXED: now correctly reads incomeEntries (log-based) instead of incomeActual
function MonthlyTab({ state, fmt, MONTHS, selYear, setSelYear, selMonth, onSelect }) {
  const { dark } = React.useContext(ThemeCtx);
  const now = new Date();

  const getMonthSummary = (y, m) => {
    const mk = mkKey(y, m);
    const d  = state.months[mk];
    if (!d) return null;

    // Income: log-based (incomeEntries) — FIXED
    const incomeEntries = d.incomeEntries || [];
    const inc  = incomeEntries.reduce((s,e) => s + num(e.amount), 0);
    const bInc = num(d.incomeBudget || 0);
    const tActAuto = inc * 0.1;
    const tBudAuto = bInc * 0.1;

    const allExpCats  = [...DEFAULT_EXPENSE_CATS, ...(state.customExpCats  || [])];
    const allBillCats = [...DEFAULT_BILL_CATS,     ...(state.customBillCats || [])];
    const allSavCats  = [...DEFAULT_SAVINGS_CATS,  ...(state.customSavCats  || [])];

    const expAmt  = allExpCats.reduce((s,c)  => s + num((d.expActual  ||{})[c.id]||0), 0);
    const billAmt = allBillCats.reduce((s,c) => s + num((d.billActual ||{})[c.id]||0), 0) + tActAuto;
    const savAmt  = allSavCats.reduce((s,c)  => s + num((d.savActual  ||{})[c.id]||0), 0);
    const exp = expAmt + billAmt + savAmt;

    const bExpAmt  = allExpCats.reduce((s,c)  => s + num((d.expBudget  ||{})[c.id]||0), 0);
    const bBillAmt = allBillCats.reduce((s,c) => s + num((d.billBudget ||{})[c.id]||0), 0) + tBudAuto;
    const bSavAmt  = allSavCats.reduce((s,c)  => s + num((d.savBudget  ||{})[c.id]||0), 0);
    const bExp = bExpAmt + bBillAmt + bSavAmt;

    return { inc, exp, bal: inc-exp, bInc, bExp, bBal: bInc-bExp, hasData: inc>0||exp>0 };
  };

  const ytdMonths = MONTHS.map((_,i) => getMonthSummary(selYear, i)).filter(Boolean);
  const ytdInc    = ytdMonths.reduce((s,m) => s+m.inc, 0);
  const ytdExp    = ytdMonths.reduce((s,m) => s+m.exp, 0);
  const ytdBal    = ytdInc - ytdExp;
  const hasYtd    = ytdInc>0||ytdExp>0;
  const canGoForward = true;

  const cardColor = (data) => {
    if (!data||!data.hasData) return null;
    if (data.bal<0) return { bg: dark?"#2A1515":"#FFF5F5", border: dark?"#4A2020":"#FFCDD2", label:"#FF3B30" };
    const pct = data.bInc>0 ? data.exp/data.bInc : 0;
    if (pct>0.9) return { bg: dark?"#2A2010":"#FFFBF0", border: dark?"#4A3A10":"#FFE4B0", label:"#FF9500" };
    return { bg: dark?"#0F2A15":"#F0FFF4", border: dark?"#1A4A20":"#B7EBC8", label:"#34C759" };
  };

  const bg = dark ? "#0A0A0F" : "#F7F7F8";
  const textPrimary = dark ? "#F2F2F7" : "#1C1C1E";
  const textMuted = "#8E8E93";

  return (
    <div style={{ animation:"fadeUp .3s ease", padding:"52px 16px 20px", background:bg, minHeight:"100vh" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
        <button onClick={()=>setSelYear(y=>y-1)} style={{ background: dark?"#2C2C2E":"#F2F2F7", borderRadius:10, padding:"6px 14px", color: dark?"#E0E0E0":"#3C3C43", fontSize:16, border:"none" }}>‹</button>
        <div style={{ fontSize:22, fontWeight:700, color:textPrimary }}>{selYear}</div>
        <button onClick={()=>{ if(canGoForward) setSelYear(y=>y+1); }} style={{ background: dark?"#2C2C2E":"#F2F2F7", borderRadius:10, padding:"6px 14px", color:canGoForward? dark?"#E0E0E0":"#3C3C43":"#C7C7CC", fontSize:16, border:"none" }}>›</button>
      </div>

      {hasYtd&&(
        <div style={{ background: dark?"linear-gradient(135deg,#1A1A2E,#16213E)":"linear-gradient(135deg,#1C1C1E,#2C2C2E)", borderRadius:18, padding:"16px", marginBottom:14, boxShadow:"0 2px 8px rgba(0,0,0,.12)" }}>
          <div style={{ fontSize:11, color:"rgba(255,255,255,.5)", letterSpacing:1.5, marginBottom:10 }}>{selYear} YEAR SO FAR</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
            <div><div style={{ fontSize:10, color:"rgba(255,255,255,.4)", marginBottom:3 }}>Income</div><div style={{ fontSize:15, fontWeight:700, color:"#30D158" }}>{fmt(ytdInc)}</div></div>
            <div><div style={{ fontSize:10, color:"rgba(255,255,255,.4)", marginBottom:3 }}>Spent</div><div style={{ fontSize:15, fontWeight:700, color:"#FF6B6B" }}>{fmt(ytdExp)}</div></div>
            <div><div style={{ fontSize:10, color:"rgba(255,255,255,.4)", marginBottom:3 }}>Net</div><div style={{ fontSize:15, fontWeight:700, color:ytdBal<0?"#FF453A":"#30D158" }}>{fmt(ytdBal)}</div></div>
          </div>
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
        {MONTHS.map((m,i)=>{
          const data=getMonthSummary(selYear,i);
          const isCurrent=selYear===now.getFullYear()&&i===now.getMonth();
          const isFutureMonth=selYear===now.getFullYear()&&i>now.getMonth();
          const isFutureYear=selYear>now.getFullYear();
          const isFuture = isFutureMonth || isFutureYear;
          const cc=cardColor(data);
          const over=data&&data.bExp>0&&data.exp>data.bExp;

          const defaultBg = dark?"#1C1C1E":"#fff";
          const defaultBorder = dark?"#2C2C2E":"#F2F2F7";
          const futureBg = dark?"#161618":"#F9F9FB";
          const futureBorder = dark?"#2A2A2C":"#EBEBEF";

          return (
            <button key={i} onClick={()=>onSelect(selYear,i)} style={{
              background: isCurrent?(dark?"#2A1E0F":"#FFF8F0"):cc?cc.bg:isFuture?futureBg:defaultBg,
              border:`1.5px solid ${isCurrent?(dark?"#7A5010":"#FF9500"):cc?cc.border:isFuture?futureBorder:defaultBorder}`,
              borderRadius:16, padding:"14px", textAlign:"left",
              opacity:1, cursor:"pointer",
              fontFamily:"inherit", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.04)",
            }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                <div style={{ fontSize:14, fontWeight:700, color:isCurrent?"#FF9500":isFuture?"#C7C7CC": dark?"#F2F2F7":"#1C1C1E" }}>{m}</div>
                <div style={{ display:"flex", gap:4, alignItems:"center" }}>
                  {over&&<div style={{ fontSize:8, background:"#FFE5E5", color:"#FF3B30", padding:"2px 5px", borderRadius:4, fontWeight:700 }}>OVER</div>}
                  {cc&&<div style={{ width:8, height:8, borderRadius:4, background:cc.label }}/>}
                  {isFuture&&!data?.hasData&&<div style={{ fontSize:8, background: dark?"#2C2C2E":"#F2F2F7", color:"#8E8E93", padding:"2px 5px", borderRadius:4, fontWeight:600 }}>PLAN</div>}
                </div>
              </div>
              {data&&data.hasData?(
                <>
                  <div style={{ fontSize:11, color:textMuted, marginBottom:2 }}>Income</div>
                  <div style={{ fontSize:14, fontWeight:700, color:"#30D158", marginBottom:4 }}>{fmt(data.inc)}</div>
                  <div style={{ fontSize:11, color:textMuted, marginBottom:2 }}>Balance</div>
                  <div style={{ fontSize:14, fontWeight:700, color:data.bal<0?"#FF3B30": dark?"#F2F2F7":"#1C1C1E" }}>{fmt(data.bal)}</div>
                </>
              ):(
                <div style={{ fontSize:12, color:"#C7C7CC", marginTop:4 }}>{isFuture?"Tap to plan":"No data"}</div>
              )}
            </button>
          );
        })}
      </div>

      {hasYtd&&(
        <div style={{ display:"flex", gap:16, marginTop:12, justifyContent:"center" }}>
          {[{color:"#34C759",label:"On track"},{color:"#FF9500",label:"Near budget"},{color:"#FF3B30",label:"Over / negative"}].map((item,i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:5 }}>
              <div style={{ width:8, height:8, borderRadius:4, background:item.color }}/>
              <span style={{ fontSize:11, color:textMuted }}>{item.label}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── App ────────────────────────────────────────────────────
function App() {
  const [state,       setState]       = useState(initState);
  const [tab,         setTab]         = useState("home");
  const [selYear,     setSelYear]     = useState(NOW.getFullYear());
  const [selMonth,    setSelMonth]    = useState(NOW.getMonth());
  const [showSettings, setShowSettings] = useState(false);
  const [user,        setUser]        = useState(undefined); // undefined = loading, null = signed out
  const [syncStatus,  setSyncStatus]  = useState(""); // "", "saving", "saved", "offline"

  const dark = state.darkMode || false;
  const currency = state.currency || "USD";
  const fmt = makeFmt(currency);
  const curObj = CURRENCIES.find(c => c.code === currency) || CURRENCIES[0];
  const currencySymbol = curObj.symbol;

  // ── Auth listener ──────────────────────────────────────────
  useEffect(() => {
    const ready = async () => {
      // Await Google redirect result first (needed for iOS Safari)
      if (window._fbRedirectResult) await window._fbRedirectResult;
      window._fbOnAuth(async (u) => {
        setUser(u);
        if (u) {
          setSyncStatus("loading");
          const cloud = await fbLoad(u.uid);
          if (cloud) { setState(cloud); saveState(cloud); }
          setSyncStatus("saved");
        }
      });
    };
    if (window._fbReady) ready();
    else window.addEventListener("firebase-ready", ready, { once: true });
  }, []);

  // ── Save: localStorage always, Firestore when signed in ───
  const saveTimer = useRef(null);
  useEffect(() => {
    saveState(state);
    if (user) {
      setSyncStatus("saving");
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(async () => {
        await fbSave(user.uid, state);
        setSyncStatus("saved");
      }, 1200); // debounce — wait 1.2s after last change
    }
  }, [state]);

  useEffect(() => {
    document.body.className = dark ? "dark" : "";
    document.body.style.background = dark ? "#0A0A0F" : "#F7F7F8";
  }, [dark]);

  const mk = mkKey(selYear, selMonth);
  const monthData = state.months[mk] || makeBlankMonth(state.customExpCats, state.customBillCats, state.customSavCats);

  // Previous month data for "copy last month" feature
  const prevMk = (() => { let py=selYear, pm=selMonth-1; if(pm<0){py-=1;pm=11;} return mkKey(py,pm); })();
  const prevMonthData = state.months[prevMk] || null;

  const setMonthData = (updater) => {
    setState(prev => {
      const current = prev.months[mk] || makeBlankMonth(prev.customExpCats, prev.customBillCats, prev.customSavCats);
      const updated = typeof updater === "function" ? updater(current) : updater;
      return { ...prev, months: { ...prev.months, [mk]: updated } };
    });
  };

  // Auto-fill recurring bill budgets from previous month
  useEffect(() => {
    if (state.months[mk]) return;
    const prevData = state.months[prevMk];
    if (!prevData) return;
    const recurringIds = state.recurringBillIds || [];
    if (!recurringIds.length) return;
    const src = prevData.billBudget || {};
    const carry = {};
    recurringIds.forEach(id => { if (src[id]) carry[id] = src[id]; });
    setMonthData(d => ({ ...d, billBudget: { ...d.billBudget, ...carry } }));
  }, [mk]);

  const incomeEntries     = monthData.incomeEntries || [];
  const totalIncomeActual = incomeEntries.reduce((s,e)=>s+num(e.amount),0);
  const totalIncomeBudget = num(monthData.incomeBudget);
  const tithingActualAuto = totalIncomeActual * 0.1;
  const tithingBudgetAuto = totalIncomeBudget * 0.1;

  const customExpCats    = state.customExpCats  || [];
  const customBillCats   = state.customBillCats || [];
  const customSavCats    = state.customSavCats  || [];
  const recurringBillIds = state.recurringBillIds || [];

  const addCustomCat = (section, cat) => setState(prev=>({...prev,[section]:[...(prev[section]||[]),cat]}));
  const deleteCustomCat = (section, catId) => setState(prev=>({...prev,[section]:(prev[section]||[]).filter(c=>c.id!==catId)}));
  const toggleRecurring = (catId) => setState(prev=>{ const ids=prev.recurringBillIds||[]; return {...prev,recurringBillIds:ids.includes(catId)?ids.filter(i=>i!==catId):[...ids,catId]}; });

  const allExpCats  = [...DEFAULT_EXPENSE_CATS, ...customExpCats];
  const allBillCats = [...DEFAULT_BILL_CATS,    ...customBillCats];
  const allSavCats  = [...DEFAULT_SAVINGS_CATS,  ...customSavCats];

  const expBudgetTotal  = allExpCats.reduce((s,c)  => s+num((monthData.expBudget ||{})[c.id]||0), 0);
  const expActualTotal  = allExpCats.reduce((s,c)  => s+num((monthData.expActual ||{})[c.id]||0), 0);
  const billBudgetTotal = allBillCats.reduce((s,c) => s+num((monthData.billBudget||{})[c.id]||0), 0)+tithingBudgetAuto;
  const billActualTotal = allBillCats.reduce((s,c) => s+num((monthData.billActual||{})[c.id]||0), 0)+tithingActualAuto;
  const savBudgetTotal  = allSavCats.reduce((s,c)  => s+num((monthData.savBudget ||{})[c.id]||0), 0);
  const savActualTotal  = allSavCats.reduce((s,c)  => s+num((monthData.savActual ||{})[c.id]||0), 0);
  const totalExpBudget  = expBudgetTotal+billBudgetTotal+savBudgetTotal;
  const totalExpActual  = expActualTotal+billActualTotal+savActualTotal;
  const balBudget       = totalIncomeBudget-totalExpBudget;
  const balActual       = totalIncomeActual-totalExpActual;

  const prevMonth = () => { if(selMonth===0){setSelYear(y=>y-1);setSelMonth(11);}else setSelMonth(m=>m-1); };
  const nextMonth = () => { if(selMonth===11){setSelYear(y=>y+1);setSelMonth(0);}else setSelMonth(m=>m+1); };

  const NAV = [
    { id:"home",     icon:<HouseIcon/>,  label:"Overview" },
    { id:"monthly",  icon:<CalIcon/>,    label:"Monthly"  },
    { id:"income",   icon:<IncIcon/>,    label:"Income"   },
    { id:"expenses", icon:<ExpIcon/>,    label:"Expenses" },
    { id:"bills",    icon:<BillIcon/>,   label:"Bills"    },
    { id:"savings",  icon:<SaveIcon/>,   label:"Savings"  },
  ];

  const tabIds = NAV.map(n => n.id);
  const goNextTab = useCallback(() => {
    const i = tabIds.indexOf(tab);
    if (i < tabIds.length - 1) { haptic("light"); setTab(tabIds[i + 1]); }
  }, [tab]);
  const goPrevTab = useCallback(() => {
    const i = tabIds.indexOf(tab);
    if (i > 0) { haptic("light"); setTab(tabIds[i - 1]); }
  }, [tab]);

  // On home tab: swipe left/right = next/prev month
  const goNextMonth = useCallback(() => { haptic("light"); nextMonth(); }, [selMonth, selYear]);
  const goPrevMonth = useCallback(() => { haptic("light"); prevMonth(); }, [selMonth, selYear]);

  const swipeIsOnHome = tab === "home";
  const tabSwipe = useSwipe(goNextTab, goPrevTab, { threshold: 60, maxVertical: 70, disabled: swipeIsOnHome });
  const monthSwipe = useSwipe(goNextMonth, goPrevMonth, { threshold: 60, maxVertical: 70, disabled: !swipeIsOnHome });

  const appBg = dark ? "#0A0A0F" : "#F7F7F8";
  const navBg = dark ? "rgba(20,20,25,.97)" : "rgba(255,255,255,.95)";
  const navBorder = dark ? "#2C2C2E" : "#E5E5EA";

  // ── Auth form state ───────────────────────────────────────
  const [authEmail,    setAuthEmail]    = React.useState("");
  const [authPw,       setAuthPw]       = React.useState("");
  const [authMode,     setAuthMode]     = React.useState("signin"); // "signin" | "signup" | "link"
  const [authLoading,  setAuthLoading]  = React.useState(false);
  const [authError,    setAuthError]    = React.useState("");
  const [googleLoading,setGoogleLoading]= React.useState(false);

  const handleGoogle = async () => {
    setAuthError("");
    setGoogleLoading(true);
    try {
      await window._fbGoogleSignIn();
    } catch(e) {
      if (e.code === "auth/link-required") {
        // Email/password account exists — ask user to enter their password to link accounts
        setAuthMode("link");
        setAuthEmail(e.email || "");
        setAuthError("You already have an account with this email. Enter your password below to connect Google to it.");
      } else if (e.code !== "auth/cancelled-popup-request" && e.code !== "auth/popup-closed-by-user") {
        setAuthError("Google sign-in failed: " + (e.message || e.code));
      }
    }
    setGoogleLoading(false);
  };

  const handleAuth = async () => {
    setAuthError("");
    if (!authEmail || !authPw) { setAuthError("Please enter your email and password."); return; }
    if (authPw.length < 6)    { setAuthError("Password must be at least 6 characters."); return; }
    setAuthLoading(true);
    try {
      if (authMode === "link") {
        // Link Google credential to existing email/password account
        await window._fbLinkGoogle(authEmail, authPw);
      } else if (authMode === "signin") {
        await window._fbSignIn(authEmail, authPw);
      } else {
        await window._fbSignUp(authEmail, authPw);
      }
    } catch(e) {
      const msgs = {
        "auth/user-not-found":       "No account found. Try creating one.",
        "auth/wrong-password":       "Wrong password. Try again.",
        "auth/invalid-credential":   "Wrong email or password.",
        "auth/email-already-in-use": "Email already registered. Sign in instead.",
        "auth/invalid-email":        "That doesn't look like a valid email.",
        "auth/too-many-requests":    "Too many attempts. Try again in a moment.",
      };
      setAuthError(msgs[e.code] || e.message);
    }
    setAuthLoading(false);
  };

  // ── Loading screen ─────────────────────────────────────────
  if (user === undefined) return (
    <div style={{ minHeight:"100vh", background:"#1C1C1E", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16 }}>
      <div style={{ fontSize:40 }}>💸</div>
      <div style={{ fontSize:22, fontWeight:700, color:"#fff" }}>Spendr</div>
      <div style={{ fontSize:13, color:"#8E8E93" }}>Loading…</div>
    </div>
  );

  // ── Sign-in screen ─────────────────────────────────────────
  if (user === null) return (
    <div style={{ minHeight:"100vh", background:"#1C1C1E", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"32px 24px" }}>
      <div style={{ width:"100%", maxWidth:360 }}>
        {/* Logo */}
        <div style={{ textAlign:"center", marginBottom:36 }}>
          <div style={{ fontSize:52, marginBottom:8 }}>💸</div>
          <div style={{ fontSize:28, fontWeight:800, color:"#fff", letterSpacing:-0.5 }}>Spendr</div>
          <div style={{ fontSize:14, color:"#8E8E93", marginTop:6 }}>
            {authMode==="signin" ? "Sign in to sync across devices" : "Create your free account"}
          </div>
        </div>

        {/* Google button */}
        <button onClick={handleGoogle} disabled={googleLoading}
          style={{ width:"100%", display:"flex", alignItems:"center", justifyContent:"center", gap:10, background:"#fff", border:"none", borderRadius:12, padding:"14px", fontSize:15, fontWeight:600, color:"#1C1C1E", cursor:"pointer", opacity:googleLoading?0.6:1, marginBottom:16 }}>
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 29.8 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/><path fill="#34A853" d="M6.3 14.7l7 5.1C15.1 17 19.3 14 24 14c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2c-7.6 0-14.1 4.4-17.7 10.7z"/><path fill="#FBBC05" d="M24 46c5.5 0 10.5-1.9 14.3-5l-6.6-5.4C29.8 37.5 27 38.5 24 38.5c-5.7 0-10.6-3.2-13-7.8l-7 5.4C7.7 41.7 15.3 46 24 46z"/><path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-.6 2.3-2 4.3-3.9 5.7l6.6 5.4C42.4 36.3 45 30.5 45 24c0-1.3-.2-2.7-.5-4z"/></svg>
          {googleLoading ? "Redirecting…" : "Continue with Google"}
        </button>

        {/* Divider */}
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
          <div style={{ flex:1, height:1, background:"#2C2C2E" }}/>
          <span style={{ fontSize:12, color:"#48484A" }}>or use email</span>
          <div style={{ flex:1, height:1, background:"#2C2C2E" }}/>
        </div>

        {/* Email/password form */}
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <input
            type="email" placeholder="Email" value={authEmail}
            onChange={e=>setAuthEmail(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleAuth()}
            style={{ background:"#2C2C2E", border:"1px solid #3A3A3C", borderRadius:12, padding:"14px 16px", fontSize:16, color:"#fff", width:"100%", outline:"none" }}
          />
          <input
            type="password" placeholder="Password (min 6 characters)" value={authPw}
            onChange={e=>setAuthPw(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleAuth()}
            style={{ background:"#2C2C2E", border:"1px solid #3A3A3C", borderRadius:12, padding:"14px 16px", fontSize:16, color:"#fff", width:"100%", outline:"none" }}
          />
          {authError && (
            <div style={{ fontSize:13, color:"#FF453A", background:"#FF453A18", borderRadius:8, padding:"10px 12px" }}>
              {authError}
            </div>
          )}
          <button onClick={handleAuth} disabled={authLoading}
            style={{ background:"#FF9500", border:"none", borderRadius:12, padding:"15px", fontSize:16, fontWeight:700, color:"#fff", cursor:"pointer", opacity:authLoading?0.6:1 }}>
            {authLoading ? "Please wait…" : authMode==="link" ? "Connect Google & Sign In" : authMode==="signin" ? "Sign In" : "Create Account"}
          </button>
        </div>

        {/* Toggle */}
        {authMode !== "link" && (
        <div style={{ textAlign:"center", marginTop:20 }}>
          <span style={{ fontSize:14, color:"#8E8E93" }}>
            {authMode==="signin" ? "Don't have an account? " : "Already have an account? "}
          </span>
          <button onClick={()=>{ setAuthMode(m=>m==="signin"?"signup":"signin"); setAuthError(""); }}
            style={{ background:"none", border:"none", fontSize:14, color:"#FF9500", fontWeight:600, cursor:"pointer" }}>
            {authMode==="signin" ? "Create one" : "Sign in"}
          </button>
        </div>
        )}

        <div style={{ fontSize:11, color:"#48484A", textAlign:"center", marginTop:20 }}>
          Your data is private and only accessible with your account.
        </div>
      </div>
    </div>
  );

  return (
    <ThemeCtx.Provider value={{ dark, currency, currencySymbol }}>
      <div style={{ minHeight:"100vh", maxWidth:430, margin:"0 auto", background:appBg, display:"flex", flexDirection:"column", position:"relative" }}>
        {/* Gear icon — inside app box, top-right */}
        {(()=>{ const onDark = tab==="home"; return (
        <button onClick={()=>{ haptic("light"); setShowSettings(true); }} className="nb" style={{ position:"absolute", top:"calc(12px + env(safe-area-inset-top,0px))", right:16, zIndex:100, width:36, height:36, borderRadius:10, background: onDark?"rgba(255,255,255,.15)": dark?"rgba(44,44,46,.9)":"rgba(255,255,255,.92)", backdropFilter:"blur(12px)", border:`1px solid ${onDark?"rgba(255,255,255,0.25)": dark?"#3A3A3C":"#D1D1D6"}`, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"0 2px 8px rgba(0,0,0,.15)" }}>
          <span style={{ color: onDark?"rgba(255,255,255,0.9)": dark?"#E0E0E0":"#3C3C43" }}><GearIcon/></span>
        </button>
        );})()}
        {/* Sync status pill */}
        {syncStatus==="saving"&&<div style={{ position:"absolute", top:"calc(12px + env(safe-area-inset-top,0px))", left:16, zIndex:100, fontSize:10, background:"rgba(255,149,0,.15)", color:"#FF9500", borderRadius:8, padding:"4px 8px", fontWeight:600 }}>Syncing…</div>}
        {syncStatus==="saved"&&<div style={{ position:"absolute", top:"calc(12px + env(safe-area-inset-top,0px))", left:16, zIndex:100, fontSize:10, background:"rgba(52,199,89,.15)", color:"#34C759", borderRadius:8, padding:"4px 8px", fontWeight:600 }}>✓ Synced</div>}
        <div style={{ flex:1, overflowY:"auto", paddingBottom:90 }}
          onTouchStart={e=>{ tabSwipe.onTouchStart(e); monthSwipe.onTouchStart(e); }}
          onTouchEnd={e=>{ tabSwipe.onTouchEnd(e); monthSwipe.onTouchEnd(e); }}
        >
          {tab==="home"&&<HomeTab selYear={selYear} selMonth={selMonth} MONTHS={MONTHS} prevMonth={prevMonth} nextMonth={nextMonth} incomeEntries={incomeEntries} totalIncomeBudget={totalIncomeBudget} totalIncomeActual={totalIncomeActual} tithingBudgetAuto={tithingBudgetAuto} tithingActualAuto={tithingActualAuto} expBudgetTotal={expBudgetTotal} expActualTotal={expActualTotal} billBudgetTotal={billBudgetTotal} billActualTotal={billActualTotal} savBudgetTotal={savBudgetTotal} savActualTotal={savActualTotal} totalExpBudget={totalExpBudget} totalExpActual={totalExpActual} balBudget={balBudget} balActual={balActual} fmt={fmt} setTab={setTab} hasPrevMonth={!!prevMonthData} onCopyLastMonth={()=>{ if(!prevMonthData) return; setMonthData(d=>({ ...d, incomeBudget: prevMonthData.incomeBudget||d.incomeBudget, expBudget:{...d.expBudget,...(prevMonthData.expBudget||{})}, billBudget:{...d.billBudget,...(prevMonthData.billBudget||{})}, savBudget:{...d.savBudget,...(prevMonthData.savBudget||{})} })); }}/>}

          {tab==="income"&&<IncomeTab data={monthData} setData={setMonthData} tithingActualAuto={tithingActualAuto} selYear={selYear} selMonth={selMonth} MONTHS={MONTHS} fmt={fmt} onBack={()=>setTab("home")} prevMonthData={prevMonthData}/>}

          {tab==="expenses"&&<SectionTab title="Expenses" icon="💸" color="#FF6B6B" cats={DEFAULT_EXPENSE_CATS} customCats={customExpCats} budget={monthData.expBudget||{}} actual={monthData.expActual||{}} notes={monthData.expNotes||{}} expEntries={monthData.expEntries||{}} setBudget={v=>setMonthData(d=>({...d,expBudget:{...d.expBudget,...v}}))} setActual={v=>setMonthData(d=>({...d,expActual:{...d.expActual,...v}}))} setNotes={v=>setMonthData(d=>({...d,expNotes:{...d.expNotes,...v}}))} setExpEntries={v=>setMonthData(d=>({...d,expEntries:{...d.expEntries,...v}}))} onAddCustomCat={cat=>addCustomCat("customExpCats",cat)} onDeleteCustomCat={id=>deleteCustomCat("customExpCats",id)} showRecurring={false} selYear={selYear} selMonth={selMonth} MONTHS={MONTHS} fmt={fmt} onBack={()=>setTab("home")} prevMonthData={prevMonthData} section="expenses"/>}

          {tab==="bills"&&<SectionTab title="Bills" icon="📋" color="#60A5FA" cats={DEFAULT_BILL_CATS} customCats={customBillCats} budget={monthData.billBudget||{}} actual={monthData.billActual||{}} notes={monthData.billNotes||{}} expEntries={monthData.billEntries||{}} setBudget={v=>setMonthData(d=>({...d,billBudget:{...d.billBudget,...v}}))} setActual={v=>setMonthData(d=>({...d,billActual:{...d.billActual,...v}}))} setNotes={v=>setMonthData(d=>({...d,billNotes:{...d.billNotes,...v}}))} setExpEntries={v=>setMonthData(d=>({...d,billEntries:{...d.billEntries,...v}}))} onAddCustomCat={cat=>addCustomCat("customBillCats",cat)} onDeleteCustomCat={id=>deleteCustomCat("customBillCats",id)} showRecurring={true} recurringIds={recurringBillIds} onToggleRecurring={toggleRecurring} tithingBudgetAuto={tithingBudgetAuto} tithingActualAuto={tithingActualAuto} selYear={selYear} selMonth={selMonth} MONTHS={MONTHS} fmt={fmt} onBack={()=>setTab("home")} prevMonthData={prevMonthData} section="bills"/>}

          {tab==="savings"&&<SavingsTab data={monthData} setData={setMonthData} customSavCats={customSavCats} onAddCustomSavCat={cat=>addCustomCat("customSavCats",cat)} onDeleteCustomSavCat={id=>deleteCustomCat("customSavCats",id)} selYear={selYear} selMonth={selMonth} MONTHS={MONTHS} fmt={fmt} onBack={()=>setTab("home")} prevMonthData={prevMonthData}/>}

          {tab==="monthly"&&<MonthlyTab state={state} fmt={fmt} MONTHS={MONTHS} selYear={selYear} setSelYear={setSelYear} selMonth={selMonth} onSelect={(y,m)=>{setSelYear(y);setSelMonth(m);setTab("home");}}/>}

          <DataToolbar state={state} onImport={ns=>{setState(ns);}}/>
        </div>

        {/* Bottom nav */}
        <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:430, background:navBg, backdropFilter:"blur(20px)", borderTop:`1px solid ${navBorder}`, display:"flex", padding:"8px 0 calc(8px + env(safe-area-inset-bottom,0px))", zIndex:50 }}>
          {NAV.map(item=>(
            <button key={item.id} className="nb" onClick={()=>{ haptic("light"); setTab(item.id); }} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3, background:"none", padding:"4px 0", border:"none" }}>
              <span style={{ color:tab===item.id?"#FF9500":"#8E8E93", transition:"color .15s" }}>{item.icon}</span>
              <span style={{ fontSize:9, fontWeight:600, color:tab===item.id?"#FF9500":"#8E8E93", letterSpacing:0.2 }}>{item.label}</span>
            </button>
          ))}
        </div>

        {/* Settings modal */}
        {showSettings&&<SettingsSheet state={state} setState={setState} fmt={fmt} MONTHS={MONTHS} onClose={()=>setShowSettings(false)} user={user}/>}
      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<!-- Service Worker registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Spendr SW registered:', reg.scope))
      .catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
</html>
