<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Spendr – Monthly Budget</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json"/>

  <!-- Theme & status bar -->
  <meta name="theme-color" content="#FF9500"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Spendr"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png"/>
  <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144.png"/>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="96x96"   href="icons/icon-96.png"/>

  <!-- Description for install prompts -->
  <meta name="description" content="Simple, private monthly budget tracker. No account needed."/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
             GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
             fetchSignInMethodsForEmail, linkWithCredential, EmailAuthProvider,
             signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, enableIndexedDbPersistence }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────
    const firebaseConfig = {
      apiKey: "<EDIT>",
      authDomain: "<EDIT>",
      projectId: "<EDIT>",
      storageBucket: "<EDIT>",
      messagingSenderId: "<EDIT>",
      appId: "<EDIT>"
    };
    // ─────────────────────────────────────────────────────────

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    enableIndexedDbPersistence(db).catch(() => {});

    const provider = new GoogleAuthProvider();

    // iOS Safari & PWA: use redirect. Desktop: use popup.
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
                  || window.matchMedia('(display-mode: standalone)').matches;

    // Capture redirect result immediately on page load
    const redirectResult = getRedirectResult(auth).catch(() => null);

    window._fbAuth         = auth;
    window._fbDb           = db;
    window._fbDoc          = doc;
    window._fbGetDoc       = getDoc;
    window._fbSetDoc       = setDoc;
    window._fbSignIn       = (email, pw) => signInWithEmailAndPassword(auth, email, pw);
    window._fbSignUp       = (email, pw) => createUserWithEmailAndPassword(auth, email, pw);
    // Google sign-in with account linking:
    // If the user already has an email/password account with the same email,
    // we sign them into that account instead of creating a new Google account.
    window._fbGoogleSignIn = async () => {
      if (isIOS) {
        return signInWithRedirect(auth, provider);
      }
      try {
        return await signInWithPopup(auth, provider);
      } catch(e) {
        // If email already exists under a different provider, sign in with email/password
        // and link the Google credential so both work going forward
        if (e.code === "auth/account-exists-with-different-credential") {
          window._fbPendingGoogleCred = e.credential;
          window._fbPendingEmail = e.customData?.email || "";
          throw { code: "auth/link-required", email: window._fbPendingEmail };
        }
        throw e;
      }
    };
    window._fbLinkGoogle = async (email, password) => {
      const result = await signInWithEmailAndPassword(auth, email, password);
      if (window._fbPendingGoogleCred) {
        await linkWithCredential(result.user, window._fbPendingGoogleCred);
        window._fbPendingGoogleCred = null;
        window._fbPendingEmail = null;
      }
      return result;
    };
    window._fbRedirectResult = redirectResult;
    window._fbSignOut      = () => signOut(auth);
    window._fbOnAuth       = (cb) => onAuthStateChanged(auth, cb);

    window._fbReady = true;
    window.dispatchEvent(new Event("firebase-ready"));
  </script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, 'Segoe UI', sans-serif; transition: background .3s; }

input[type=number] { -moz-appearance: textfield; }

.nb:active { opacity: 0.5; }
::-webkit-scrollbar { width: 0; }

/* Dark mode */
body.dark { background: #0A0A0F; }
body.dark input::placeholder { color: #48485A; }

/* Settings sheet - slides down from top */
.settings-sheet { position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(-110%); width: 100%; max-width: 430px; background: #fff; border-radius: 0 0 24px 24px; padding: calc(env(safe-area-inset-top,0px) + 16px) 20px 24px; box-shadow: 0 8px 40px rgba(0,0,0,.18); z-index: 200; transition: transform .38s cubic-bezier(.32,0,.67,0), background .3s; }
.settings-sheet.open { transform: translateX(-50%) translateY(0); transition: transform .42s cubic-bezier(.22,1,.36,1), background .3s; }
body.dark .settings-sheet { background: #1C1C1E; }
.settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 199; opacity: 0; transition: opacity .3s; }
.settings-overlay.open { opacity: 1; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ──────────────────────────────────────────────
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const NOW    = new Date();
const KEY    = "spendr-v6";

const CURRENCIES = [
  { code: "USD", symbol: "$", name: "US Dollar" },
  { code: "EUR", symbol: "€", name: "Euro" },
  { code: "GBP", symbol: "£", name: "British Pound" },
  { code: "JPY", symbol: "¥", name: "Japanese Yen" },
  { code: "CAD", symbol: "CA$", name: "Canadian Dollar" },
  { code: "AUD", symbol: "A$", name: "Australian Dollar" },
  { code: "CHF", symbol: "Fr", name: "Swiss Franc" },
  { code: "INR", symbol: "₹", name: "Indian Rupee" },
  { code: "MXN", symbol: "MX$", name: "Mexican Peso" },
  { code: "BRL", symbol: "R$", name: "Brazilian Real" },
  { code: "KRW", symbol: "₩", name: "South Korean Won" },
  { code: "PHP", symbol: "₱", name: "Philippine Peso" },
  { code: "THB", symbol: "฿", name: "Thai Baht" },
  { code: "NZD", symbol: "NZ$", name: "New Zealand Dollar" },
];

const DEFAULT_EXPENSE_CATS = [
  { id: "groceries",     label: "Groceries",      icon: "🛒" },
  { id: "dining",        label: "Dining Out",      icon: "🍽" },
  { id: "personalcare",  label: "Personal Care",   icon: "🧴" },
  { id: "entertainment", label: "Entertainment",   icon: "🎬" },
  { id: "homesupplies",  label: "Home Supplies",   icon: "🏡" },
  { id: "transport",     label: "Transportation",  icon: "🚗" },
  { id: "gift",          label: "Gift",            icon: "🎁" },
  { id: "other",         label: "Other",           icon: "📦" },
];
const DEFAULT_BILL_CATS = [
  { id: "rent",      label: "Rent",             icon: "🏠" },
  { id: "electric",  label: "Electricity",      icon: "⚡" },
  { id: "cellphone", label: "Cell Phone",       icon: "📱" },
  { id: "internet",  label: "Internet",         icon: "🌐" },
  { id: "insurance", label: "Health Insurance", icon: "🏥" },
];
const DEFAULT_SAVINGS_CATS = [
  { id: "emergency", label: "Emergency Fund", icon: "🛡"  },
  { id: "vacation",  label: "Vacation",       icon: "✈️"  },
  { id: "invest",    label: "Investments",    icon: "📈"  },
  { id: "other_sav", label: "Other Savings",  icon: "💰"  },
];

// ── Storage ────────────────────────────────────────────────
const loadState = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch { return null; } };
const saveState = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };

// ── Firebase helpers (safe to call even before auth) ────────
const fbSave = async (uid, state) => {
  if (!uid || !window._fbDb) return;
  try {
    await window._fbSetDoc(
      window._fbDoc(window._fbDb, 'users', uid),
      { data: JSON.stringify(state), updatedAt: Date.now() }
    );
  } catch (e) { console.warn('Firestore save failed:', e); }
};
const fbLoad = async (uid) => {
  if (!uid || !window._fbDb) return null;
  try {
    const snap = await window._fbGetDoc(window._fbDoc(window._fbDb, 'users', uid));
    if (snap.exists()) return JSON.parse(snap.data().data);
  } catch (e) { console.warn('Firestore load failed:', e); }
  return null;
};

// ── Helpers ────────────────────────────────────────────────
const mkKey = (y, m) => `${y}-${String(m + 1).padStart(2, "0")}`;
const makeFmt = (currencyCode = "USD") => (n) => {
  if (n == null || n === "") return "—";
  const cur = CURRENCIES.find(c => c.code === currencyCode) || CURRENCIES[0];
  // For JPY/KRW no decimals
  const noDecimals = ["JPY","KRW"].includes(currencyCode);
  return new Intl.NumberFormat("en-US", {
    style: "currency", currency: currencyCode,
    minimumFractionDigits: noDecimals ? 0 : 2,
    maximumFractionDigits: noDecimals ? 0 : 2,
  }).format(n);
};
const num = (v) => parseFloat(v) || 0;
const fmtDate = (iso) => { const d = new Date(iso); return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const todayISO = () => new Date().toISOString().slice(0, 10);
const daysInMonth  = (y, m) => new Date(y, m + 1, 0).getDate();
const daysLeftInMonth = (y, m) => { const today = new Date(); if (y !== today.getFullYear() || m !== today.getMonth()) return null; return daysInMonth(y, m) - today.getDate(); };
const dayOfMonth = () => new Date().getDate();
const pctMonthElapsed = (y, m) => { const today = new Date(); if (y !== today.getFullYear() || m !== today.getMonth()) return null; return today.getDate() / daysInMonth(y, m); };
const genId = () => "c_" + Math.random().toString(36).slice(2, 9);

// ── Haptic feedback ────────────────────────────────────────
const haptic = (style = "light") => {
  if (navigator.vibrate) {
    const patterns = { light: [8], medium: [20], heavy: [40], success: [10, 50, 10], error: [30, 20, 30] };
    navigator.vibrate(patterns[style] || patterns.light);
  }
  if (window.webkit?.messageHandlers?.haptic) {
    window.webkit.messageHandlers.haptic.postMessage(style);
  }
};

function makeBlankMonth(customExpCats = [], customBillCats = [], customSavCats = []) {
  const allExp  = [...DEFAULT_EXPENSE_CATS, ...customExpCats];
  const allBill = [...DEFAULT_BILL_CATS,    ...customBillCats];
  const allSav  = [...DEFAULT_SAVINGS_CATS, ...customSavCats];
  const expBudget={}, expActual={}, expNotes={}, billBudget={}, billActual={}, billNotes={}, savBudget={}, savActual={}, savNotes={};
  allExp.forEach(c  => { expBudget[c.id]=""; expActual[c.id]=""; expNotes[c.id]=""; });
  allBill.forEach(c => { billBudget[c.id]=""; billActual[c.id]=""; billNotes[c.id]=""; });
  allSav.forEach(c  => { savBudget[c.id]=""; savActual[c.id]=""; savNotes[c.id]=""; });
  return { incomeEntries: [], incomeBudget: "", expBudget, expActual, expNotes, expEntries: {}, billBudget, billActual, billNotes, billEntries: {}, savBudget, savActual, savNotes, savEntries: {} };
}

const initState = () => {
  const saved = loadState();
  return saved || { months: {}, customExpCats: [], customBillCats: [], customSavCats: [], recurringBillIds: ["rent","cellphone","internet","insurance"], darkMode: false, currency: "USD" };
};

const exportData = (state) => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = `spendr-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
};
const importData = (file, onSuccess, onError) => {
  const reader = new FileReader();
  reader.onload = (e) => { try { const parsed = JSON.parse(e.target.result); if (parsed && parsed.months) onSuccess(parsed); else onError("Invalid backup file."); } catch { onError("Could not parse file."); } };
  reader.readAsText(file);
};

// ── Swipe hook ─────────────────────────────────────────────
function useSwipe(onSwipeLeft, onSwipeRight, { threshold = 50, maxVertical = 80, disabled = false } = {}) {
  const startX = useRef(null);
  const startY = useRef(null);
  const onTouchStart = useCallback((e) => {
    startX.current = e.touches[0].clientX;
    startY.current = e.touches[0].clientY;
  }, []);
  const onTouchEnd = useCallback((e) => {
    if (disabled || startX.current === null) return;
    const dx = e.changedTouches[0].clientX - startX.current;
    const dy = Math.abs(e.changedTouches[0].clientY - startY.current);
    if (dy > maxVertical) return;
    if (Math.abs(dx) < threshold) return;
    if (dx < 0) onSwipeLeft?.();
    else onSwipeRight?.();
    startX.current = null;
  }, [onSwipeLeft, onSwipeRight, threshold, maxVertical, disabled]);
  return { onTouchStart, onTouchEnd };
}

// ── Theme Context ──────────────────────────────────────────
const ThemeCtx = React.createContext({ dark: false, currency: "USD", currencySymbol: "$" });

// ── Components ─────────────────────────────────────────────
function SectionHeader({ title, icon, color, month, onBack }) {
  const { dark } = React.useContext(ThemeCtx);
  const bg = dark ? "#1C1C1E" : "#fff";
  const border = dark ? "#2C2C2E" : "#F2F2F7";
  return (
    <div style={{ background: dark ? `linear-gradient(160deg,${color}28 0%,${color}08 100%)` : `linear-gradient(160deg,${color}18 0%,${color}05 100%)`, padding: "52px 20px 20px", borderBottom: `1px solid ${border}` }}>
      <div style={{ fontSize: 11, color: "#8E8E93", letterSpacing: 1, marginBottom: 4 }}>{month}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 44, height: 44, borderRadius: 14, background: color+"22", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24 }}>{icon}</div>
        <div style={{ fontSize: 24, fontWeight: 800, color: dark ? "#F2F2F7" : "#1C1C1E", letterSpacing: -0.5 }}>{title}</div>
      </div>
    </div>
  );
}

function Card({ children, style = {} }) {
  const { dark } = React.useContext(ThemeCtx);
  return <div style={{ background: dark ? "#1C1C1E" : "#fff", borderRadius: 18, padding: "16px", marginBottom: 12, boxShadow: dark ? "0 1px 4px rgba(0,0,0,.3)" : "0 1px 4px rgba(0,0,0,.06)", ...style }}>{children}</div>;
}

function NumInput({ val, placeholder, onChange, color, highlight = false }) {
  const { dark, currencySymbol } = React.useContext(ThemeCtx);
  const bg = highlight ? "#FFF5F5" : dark ? "#2C2C2E" : "#F7F7F8";
  const border = highlight ? "#FFCDD2" : dark ? "#3A3A3C" : "#EFEFEF";
  const c = color || (dark ? "#F2F2F7" : "#1C1C1E");
  return (
    <div style={{ width:"100%", minWidth:0, padding:"10px 12px", background:bg, borderRadius:10, border:`1px solid ${border}`, display:"flex", alignItems:"center", gap:4, boxSizing:"border-box" }}>
      <span style={{ fontSize:13, color:"#C7C7CC", flexShrink:0 }}>{currencySymbol}</span>
      <input type="number" inputMode="decimal" placeholder={placeholder} value={val||""} onChange={e=>onChange(e.target.value)}
        style={{ flex:1, fontSize:15, fontWeight:600, color:c, minWidth:0, width:"100%", background:"transparent" }}/>
    </div>
  );
}

function NotesInput({ val, onChange }) {
  const { dark } = React.useContext(ThemeCtx);
  return (
    <div style={{ marginTop:6 }}>
      <input type="text" placeholder="Add a note…" value={val||""} onChange={e=>onChange(e.target.value)}
        style={{ width:"100%", fontSize:12, color: dark?"#A0A0B0":"#3C3C43", background: dark?"#2C2C2E":"#F7F7F8", borderRadius:8, padding:"7px 10px", border:`1px solid ${dark?"#3A3A3C":"#EFEFEF"}`, fontFamily:"inherit" }}/>
    </div>
  );
}

function InfoBox({ text }) {
  const { dark } = React.useContext(ThemeCtx);
  return (
    <div style={{ background: dark?"#1A2030":"#F2F6FF", borderRadius:14, padding:"12px 14px", marginBottom:16, display:"flex", gap:8, alignItems:"flex-start" }}>
      <span style={{ fontSize:16 }}>ℹ️</span>
      <div style={{ fontSize:12, color: dark?"#7090C0":"#3A6EA5", lineHeight:1.6 }}>{text}</div>
    </div>
  );
}

function MonthProgressBanner({ selYear, selMonth, MONTHS }) {
  const { dark } = React.useContext(ThemeCtx);
  const daysLeft  = daysLeftInMonth(selYear, selMonth);
  const pct       = pctMonthElapsed(selYear, selMonth);
  const totalDays = daysInMonth(selYear, selMonth);
  if (daysLeft === null) return null;
  const dayNum = dayOfMonth();
  const urgency = daysLeft <= 5 ? "#FF3B30" : daysLeft <= 10 ? "#FF9500" : "#34C759";
  return (
    <div style={{ margin:"12px 0 0", background: dark?"#1C1C1E":"#fff", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)", display:"flex", alignItems:"center", gap:12 }}>
      <div style={{ width:40, height:40, borderRadius:10, background:urgency+"15", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>📅</div>
      <div style={{ flex:1 }}>
        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
          <span style={{ fontSize:12, fontWeight:600, color: dark?"#E0E0E0":"#1C1C1E" }}>Day {dayNum} of {totalDays} — {MONTHS[selMonth]}</span>
          <span style={{ fontSize:12, fontWeight:700, color:urgency }}>{daysLeft===0?"Last day!":`${daysLeft} day${daysLeft===1?"":"s"} left`}</span>
        </div>
        <div style={{ height:4, background: dark?"#2C2C2E":"#F2F2F7", borderRadius:4, overflow:"hidden" }}>
          <div style={{ height:"100%", width:`${pct*100}%`, background:urgency, borderRadius:4, transition:"width .5s" }}/>
        </div>
      </div>
    </div>
  );
}

function DataToolbar({ state, onImport }) {
  const { dark } = React.useContext(ThemeCtx);
  const fileRef = useRef();
  const [imported, setImported] = useState(false);
  return (
    <div style={{ margin:"12px 16px 24px", background: dark?"#1C1C1E":"#fff", borderRadius:14, padding:"12px 14px", boxShadow: dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.05)", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
      <div>
        <div style={{ fontSize:13, fontWeight:700, color: dark?"#F2F2F7":"#1C1C1E" }}>Your Data</div>
        <div style={{ fontSize:11, color:"#8E8E93", marginTop:2 }}>{imported ? "✓ Import successful!" : "Stored in browser — back up regularly"}</div>
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={()=>{ haptic("medium"); exportData(state); }} style={{ fontSize:12, fontWeight:600, color:"#fff", background:"#34C759", borderRadius:10, padding:"8px 12px", border:"none", cursor:"pointer" }}>⬇ Export</button>
        <button onClick={()=>{ haptic("light"); fileRef.current.click(); }} style={{ fontSize:12, fontWeight:600, color:"#3A6EA5", background:"#F2F6FF", borderRadius:10, padding:"8px 12px", border:"none", cursor:"pointer" }}>⬆ Import</button>
        <input ref={fileRef} type="file" accept=".json" style={{ display:"none" }} onChange={e=>{ const f=e.target.files[0]; if(f) importData(f, ns=>{ onImport(ns); haptic("success"); setImported(true); setTimeout(()=>setImported(false), 3000); }, ()=>{ haptic("error"); }); e.target.value=""; }}/>
      </div>
    </div>
  );
}

function RecurringToggle({ catId, recurringIds, onToggle }) {
  const on = recurringIds.includes(catId);
  return (
    <button onClick={()=>onToggle(catId)} title={on?"Recurring: copies from last month":"Set as recurring"}
      style={{ fontSize:10, fontWeight:700, background:on?"#E8F5FF":"#F2F2F7", color:on?"#007AFF":"#C7C7CC", border:`1px solid ${on?"#B8DAFF":"#E5E5EA"}`, borderRadius:6, padding:"3px 7px", cursor:"pointer" }}>
      🔁 {on?"Recurring":"Set recurring"}
    </button>
  );
}

function AddCategoryRow({ onAdd }) {
  const { dark } = React.useContext(ThemeCtx);
  const [open, setOpen] = useState(false);
  const [label, setLabel] = useState("");
  const [icon, setIcon] = useState("📌");
  const ICON_OPTS = ["📌","🐾","🎓","💊","🏋️","🛠","🎮","🚌","🍼","👔","🌿","🏦","📚","🎵","✂️","🛒"];
  const submit = () => { if (!label.trim()) return; onAdd({ id:genId(), label:label.trim(), icon }); setLabel(""); setIcon("📌"); setOpen(false); };
  if (!open) return (
    <button onClick={()=>setOpen(true)} style={{ width:"100%", marginTop:8, padding:"10px", background: dark?"#2C2C2E":"#F7F7F8", borderRadius:12, border:`1.5px dashed ${dark?"#48484A":"#D1D1D6"}`, fontSize:13, color:"#8E8E93", fontWeight:600, cursor:"pointer" }}>+ Add custom category</button>
  );
  return (
    <div style={{ marginTop:8, background: dark?"#2C2C2E":"#F7F7F8", borderRadius:12, padding:"12px" }}>
      <div style={{ fontSize:11, fontWeight:700, color:"#8E8E93", marginBottom:8, letterSpacing:0.5 }}>NEW CATEGORY</div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:10 }}>
        {ICON_OPTS.map(e=>(
          <button key={e} onClick={()=>setIcon(e)} style={{ fontSize:18, width:34, height:34, borderRadius:8, background:icon===e?"#FF9500"+"22": dark?"#1C1C1E":"#fff", border:`1.5px solid ${icon===e?"#FF9500": dark?"#3A3A3C":"#E5E5EA"}`, cursor:"pointer" }}>{e}</button>
        ))}
      </div>
      <input autoFocus placeholder="Category name" value={label} onChange={e=>setLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
        style={{ width:"100%", fontSize:14, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", background: dark?"#1C1C1E":"#fff", borderRadius:10, padding:"10px 12px", border:`1px solid ${dark?"#3A3A3C":"#E5E5EA"}`, fontFamily:"inherit", marginBottom:8 }}/>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={submit} style={{ flex:1, padding:"9px", borderRadius:10, background:"#FF9500", color:"#fff", fontSize:13, fontWeight:700, border:"none", cursor:"pointer" }}>Add</button>

      </div>
    </div>
  );
}

// ── SearchPanel ────────────────────────────────────────────
function SearchPanel({ state, fmt, MONTHS, dark }) {
  const [query, setQuery] = useState("");
  const searchRef = useRef(null);

  const allResults = React.useMemo(() => {
    if (!query.trim()) return [];
    const q = query.toLowerCase().trim();
    const results = [];

    const allExpCats  = [...DEFAULT_EXPENSE_CATS,  ...(state.customExpCats  || [])];
    const allBillCats = [...DEFAULT_BILL_CATS,      ...(state.customBillCats || [])];
    const allSavCats  = [...DEFAULT_SAVINGS_CATS,   ...(state.customSavCats  || [])];

    Object.entries(state.months || {}).forEach(([mk, mdata]) => {
      const [yearStr, monthStr] = mk.split("-");
      const y = parseInt(yearStr), m = parseInt(monthStr) - 1;
      const monthLabel = `${MONTHS[m]} ${y}`;

      (mdata.incomeEntries || []).forEach(e => {
        if ((e.label||"").toLowerCase().includes(q) || String(e.amount).includes(q)) {
          results.push({ type:"income", icon:"💵", color:"#30D158", label:e.label||"Income", amount:e.amount, date:e.date, month:monthLabel, mk, section:"Income" });
        }
      });

      allExpCats.forEach(cat => {
        const entries = (mdata.expEntries || {})[cat.id] || [];
        entries.forEach(e => {
          if ((e.desc||"").toLowerCase().includes(q) || String(e.amount).includes(q) || cat.label.toLowerCase().includes(q)) {
            results.push({ type:"expense", icon:cat.icon, color:"#FF6B6B", label:e.desc||cat.label, amount:e.amount, date:e.date, month:monthLabel, mk, section:"Expenses" });
          }
        });
        const catActual = (mdata.expActual||{})[cat.id];
        if (catActual && entries.length === 0 && cat.label.toLowerCase().includes(q)) {
          results.push({ type:"expense", icon:cat.icon, color:"#FF6B6B", label:cat.label, amount:catActual, date:null, month:monthLabel, mk, section:"Expenses" });
        }
      });

      allBillCats.forEach(cat => {
        const entries = (mdata.billEntries || {})[cat.id] || [];
        entries.forEach(e => {
          if ((e.desc||"").toLowerCase().includes(q) || String(e.amount).includes(q) || cat.label.toLowerCase().includes(q)) {
            results.push({ type:"bill", icon:cat.icon, color:"#60A5FA", label:e.desc||cat.label, amount:e.amount, date:e.date, month:monthLabel, mk, section:"Bills" });
          }
        });
        const catActual = (mdata.billActual||{})[cat.id];
        if (catActual && entries.length === 0 && cat.label.toLowerCase().includes(q)) {
          results.push({ type:"bill", icon:cat.icon, color:"#60A5FA", label:cat.label, amount:catActual, date:null, month:monthLabel, mk, section:"Bills" });
        }
      });

      allSavCats.forEach(cat => {
        ((mdata.savEntries||{})[cat.id] || []).forEach(e => {
          if ((e.desc||"").toLowerCase().includes(q) || String(e.amount).includes(q) || cat.label.toLowerCase().includes(q)) {
            results.push({ type:"savings", icon:cat.icon, color:"#FF9500", label:e.desc||cat.label, amount:e.amount, date:e.date, month:monthLabel, mk, section:"Savings" });
          }
        });
      });
    });

    results.sort((a,b) => {
      if (a.date && b.date) return new Date(b.date) - new Date(a.date);
      if (a.date) return -1; if (b.date) return 1;
      return b.mk > a.mk ? 1 : -1;
    });
    return results;
  }, [query, state]);

  const cardBg = dark ? "#2C2C2E" : "#F7F7F8";

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:8, background: dark?"#3A3A3C":"#EFEFEF", borderRadius:10, padding:"8px 12px", marginBottom: query.trim() ? 10 : 0 }}>
        <span style={{ color:"#8E8E93", flexShrink:0, display:"flex" }}><SearchIcon/></span>
        <input
          ref={searchRef}
          type="text"
          placeholder="Search transactions, categories…"
          value={query}
          onChange={e=>setQuery(e.target.value)}
          style={{ flex:1, fontSize:14, color: dark?"#F2F2F7":"#1C1C1E", background:"transparent", border:"none", outline:"none", fontFamily:"inherit" }}
        />
        {query && <button onClick={()=>setQuery("")} style={{ background:"#8E8E93", border:"none", borderRadius:8, width:18, height:18, fontSize:10, color:"#fff", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>✕</button>}
      </div>
      {query.trim() && allResults.length === 0 && (
        <div style={{ textAlign:"center", padding:"16px 0", color:"#8E8E93", fontSize:13 }}>No results found</div>
      )}
      {allResults.length > 0 && (
        <div style={{ maxHeight:260, overflowY:"auto" }}>
          <div style={{ fontSize:11, color:"#8E8E93", fontWeight:600, letterSpacing:0.5, marginBottom:8 }}>{allResults.length} RESULT{allResults.length!==1?"S":""}</div>
          {allResults.map((r,i) => (
            <div key={i} style={{ background:cardBg, borderRadius:10, padding:"10px 12px", marginBottom:6, display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:34, height:34, borderRadius:8, background:r.color+"18", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>{r.icon}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, fontWeight:600, color: dark?"#F2F2F7":"#1C1C1E", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{r.label}</div>
                <div style={{ fontSize:10, color:"#8E8E93", marginTop:2 }}>
                  <span style={{ background:r.color+"22", color:r.color, padding:"1px 5px", borderRadius:4, fontWeight:600, fontSize:9, marginRight:5 }}>{r.section}</span>
                  {r.month}{r.date ? ` · ${fmtDate(r.date+"T12:00:00")}` : ""}
                </div>
              </div>
              <div style={{ fontSize:14, fontWeight:700, color:r.color, flexShrink:0 }}>{fmt(parseFloat(r.amount)||0)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── HomeTab ────────────────────────────────────────────────
function HomeTab({ selYear, selMonth, MONTHS, prevMonth, nextMonth, incomeEntries, totalIncomeBudget, totalIncomeActual, tithingBudgetAuto, tithingActualAuto, expBudgetTotal, expActualTotal, billBudgetTotal, billActualTotal, savBudgetTotal, savActualTotal, totalExpBudget, totalExpActual, balBudget, balActual, fmt, setTab, onCopyLastMonth, hasPrevMonth }) {
  const { dark } = React.useContext(ThemeCtx);
  const c = (l,d) => dark ? d : l;

  const DonutChart = ({ budget, actual, size=110 }) => {
    const r=38, cx=size/2, cy=size/2, stroke=14;
    const circ=2*Math.PI*r;
    const pct=budget>0?Math.min(actual/budget,1):0;
    const over=budget>0&&actual>budget;
    const color=over?"#FF3B30":actual/budget>0.85?"#FF9500":"#34C759";
    return (
      <svg width={size} height={size}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={dark?"#2C2C2E":"#F2F2F7"} strokeWidth={stroke}/>
        {budget>0&&<circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${pct*circ} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`} style={{transition:"stroke-dasharray .5s ease"}}/>}
        <text x={cx} y={cy-6} textAnchor="middle" fontSize="9" fill="#8E8E93" fontFamily="inherit">{over?"OVER":"USED"}</text>
        <text x={cx} y={cy+8} textAnchor="middle" fontSize="12" fontWeight="700" fill={over?"#FF3B30": dark?"#F2F2F7":"#1C1C1E"} fontFamily="inherit">{budget>0?`${Math.round(pct*100)}%`:"—"}</text>
      </svg>
    );
  };

  const Row = ({ label, budget, actual, accent }) => {
    const diff=actual-budget; const over=budget>0&&actual>budget;
    return (
      <div style={{ display:"flex", alignItems:"center", padding:"10px 0", borderBottom:`1px solid ${dark?"#2C2C2E":"#F2F2F7"}` }}>

          {budget>0&&actual>0?(over?`+${fmt(Math.abs(diff))}`:fmt(diff)):""}
        </div>
      </div>
    );

  const atEnd = false;
  const recentEntries = [...(incomeEntries||[])].reverse().slice(0,3);
  const cardBg = dark?"#1C1C1E":"#fff";
  const cardShadow = dark?"0 1px 4px rgba(0,0,0,.3)":"0 1px 4px rgba(0,0,0,.06)";

  return (
    <div style={{ animation:"fadeUp .3s ease" }}>
      {/* Hero */}
      <div style={{ background: dark?"linear-gradient(160deg,#0A0A0F 0%,#1C1C1E 100%)":"linear-gradient(160deg,#1C1C1E 0%,#2C2C2E 100%)", padding:"56px 20px 24px" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
          <button onClick={()=>{ haptic("light"); prevMonth(); }} style={{ background:"rgba(255,255,255,.1)", borderRadius:10, padding:"6px 14px", color:"#fff", fontSize:16 }}>‹</button>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:11, color:"rgba(255,255,255,.5)", letterSpacing:2, textTransform:"uppercase" }}>MONTHLY BUDGET</div>
            <div style={{ fontSize:22, fontWeight:700, color:"#fff", letterSpacing:-0.5 }}>{MONTHS[selMonth]} {selYear}</div>
            <div style={{ fontSize:10, color:"rgba(255,255,255,.3)", marginTop:3, letterSpacing:0.5 }}>← swipe to change month →</div>
          </div>
          <button onClick={()=>{ haptic("light"); nextMonth(); }} style={{ background:"rgba(255,255,255,.1)", borderRadius:10, padding:"6px 14px", color:atEnd?"rgba(255,255,255,.2)":"rgba(255,255,255,.8)", fontSize:16 }}>›</button>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12 }}>
          {[{label:"Budget Income",val:totalIncomeBudget,color:"#30D158"},{label:"Actual Income",val:totalIncomeActual,color:"#30D158"},{label:"Budget Expense",val:totalExpBudget,color:"#FF6B6B"},{label:"Actual Expense",val:totalExpActual,color:"#FF6B6B"}].map((item,i)=>(
